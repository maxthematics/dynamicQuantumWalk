// ---------------------------------------------------------------------
// CARD 1: sliders for coin bias p and phase phi
// ---------------------------------------------------------------------
// slider values snap to multiples of 1/4 when closer than 0.03
snapFrac(t) := (
  regional(best, d, v);
  best = t;  d = 2;
  forall([0, 0.25, 0.5, 0.75, 1], v, if(abs(t - v) < d, (d = abs(t - v); best = v)));
  if(d < 0.03, best, t)
);

phiTickLabel(s) := if(s==0,"0", if(s==0.25,"π/2", if(s==0.5,"π", if(s==0.75,"3π/2","2π"))));

// x = card centre, yt = card top, l = rail length
makeslider(x, yt, l) := (
  regional(lx, yP, yPhi, sP, eP, sPhi, ePhi, t, tPhi, s);
  lx = x - 0.5*cdInW() + cdPad;               // left edge of the card content

  // ---------- Bias p ----------
  yP = yt - 2.05;
  sP = (x - 0.5*l, yP);
  eP = (x + 0.5*l, yP);
  draw(sP, eP, color->colSlP, size->2);
  forall([0, 0.25, 0.5, 0.75, 1], s, cdTick(sP.x + s*l, yP, format(s, 2), colSlP));

  // handle: clamped to the rail, snapping
  slCoinpP.color = colSlP;
  slCoinpP.y = yP;
  slCoinpP.x = min(eP.x, max(sP.x, slCoinpP.x));
  t = snapFrac(|slCoinpP, sP| / l);
  slCoinpP.x = sP.x + t*l;
  coinP = t;
  stP = t;

  drawtext((lx, yt - 1.05), tr("coinBiasTitle") + " = " + uiFmt2(coinP), align->"left", size->fs(fsLab), bold->true, color->colSlP);
  drawtext((lx, yt - 1.34), tr("coinBiasHigh"), align->"left", size->fs(fsTxt), color->thMuted);
  drawtext((lx, yt - 1.61), tr("coinBiasLow"),  align->"left", size->fs(fsTxt), color->thMuted);

  // ---------- Phase φ (rail = 0 .. 2π, π/2 snaps) ----------
  yPhi = yt - 4.0;
  sPhi = (x - 0.5*l, yPhi);
  ePhi = (x + 0.5*l, yPhi);
  draw(sPhi, ePhi, color->colSlPhi, size->2);
  forall([0, 0.25, 0.5, 0.75, 1], s, cdTick(sPhi.x + s*l, yPhi, phiTickLabel(s), colSlPhi));

  slCoinPhiP.color = colSlPhi;
  slCoinPhiP.y = yPhi;
  slCoinPhiP.x = min(ePhi.x, max(sPhi.x, slCoinPhiP.x));
  tPhi = snapFrac(|slCoinPhiP, sPhi| / l);
  slCoinPhiP.x = sPhi.x + tPhi*l;
  coinRot = 2*pi*tPhi;
  stPhi = tPhi;

  drawtext((lx, yt - 2.88), tr("coinPhaseTitle") + " = " + formatPi(coinRot), align->"left", size->fs(fsLab), bold->true, color->colSlPhi);
  drawtext((lx, yt - 3.14), tr("coinPhaseDesc"), align->"left", size->fs(fsTxt), color->thMuted);
  drawtext((lx, yt - 3.4), tr("coinPhaseReal"), align->"left", size->fs(fsTxt), color->thMuted);
  drawtext((lx, yt - 3.66), tr("coinPhaseNote"), align->"left", size->fs(fsTxt), color->thMuted);

  coin = coinGen(coinP, coinRot);          // refresh the coin matrix from the sliders
);

// ---------------------------------------------------------------------
// CARD 2: symbolic and numeric coin matrix (the preset chips are drawn by the caller)
// ---------------------------------------------------------------------
// join phase factor ph ("", "-", "i", "-i", "e^{..}") with magnitude s ("0", "1", "\sqrt{..}")
uiJoin(ph, s) := (
  if(s == "0", "0",
    if(ph == "", s,
      if(ph == "-", "-" + s,
        if(s == "1", ph, ph + s)
      )
    )
  )
);

// TeX of the coin matrix with substituted values
coinNumTeX(p, phi) := (
  regional(sp, sq, pre, tk, f, eP, eM, B, C, D);
  pre = "";
  if(abs(p) < 1e-6, (sp = "0"; sq = "1"),
    if(abs(p - 1) < 1e-6, (sp = "1"; sq = "0"),
      if(abs(p - .5) < 1e-6, (sp = "1"; sq = "1"; pre = "\tfrac{1}{\sqrt2}"),
        (sp = "\sqrt{" + uiFmt2(p) + "}"; sq = "\sqrt{" + uiFmt2(1-p) + "}")
      )
    )
  );
  tk = mod(round((phi/pi)*100)/100, 2);
  f  = uiFmt2(tk);
  if(tk < 1e-9 % abs(tk-2) < 1e-9, (eP = ""; eM = ""),
    if(abs(tk-1) < 1e-9, (eP = "-"; eM = "-"),
      if(abs(tk-.5) < 1e-9, (eP = "i"; eM = "-i"),
        if(abs(tk-1.5) < 1e-9, (eP = "-i"; eM = "i"),
          (eP = "e^{i\,"  + f + "\pi}"; eM = "e^{-i\," + f + "\pi}")
        )
      )
    )
  );
  B = uiJoin(eP, sq);  C = uiJoin(eM, sq);
  D = if(sp == "0", "0", "-" + sp);
  "$U=" + pre + "\begin{pmatrix}" + sp + "&" + B + "\\" + C + "&" + D + "\end{pmatrix}$"
);

drawCoinMatrix(x, yt) := (
  drawtext((x, yt - 1.5),
    "$U(p,\phi)=\begin{pmatrix}\sqrt{p} & e^{i\phi}\sqrt{1-p}\\ e^{-i\phi}\sqrt{1-p} & -\sqrt{p}\end{pmatrix}$",
    align->"mid", size->fs(14), color->colTeXCoin);
  // numeric matrix with the current values
  drawtext((x, yt - 2.4), coinNumTeX(coinP, coinRot),
           align->"mid", size->fs(14), color->colTeXCoin);
);

// ---------------------------------------------------------------------
// CARD 3: start-state circle. Two knobs on the unit circle give the amplitudes of |←⟩ (red) and |→⟩ (blue);
// the blue knob is constrained so that |up|^2 + |down|^2 = 1 (the state stays normalised).
// ---------------------------------------------------------------------
// c = circle centre (point IC), r = radius. Sets the global start state "particle" and the remembered knob positions.
initphase(c, r) := (
  regional(dUp, zUp, zDown, complexUp, complexDown, thetaUp, thetaDown, dTheta, kPre, cxy, rx, dtTxt);
  // up knob: stays inside the circle; down knob: on the circle of radius sqrt(r^2 - |up|^2)
  dUp = |c,upP.xy|;
  upP.xy = if(dUp > 1e-6, c + min(r, dUp) * (upP.xy - c)/dUp, c);   // |→⟩: up knob sits in the centre
  downP.xy = c + sqrt(abs(r^2 - |c, upP|^2)) *
                    if(|c, downP| > 0.0001, (downP - c)/|c, downP|, [1, 0]);

  upP.color = colUp;    downP.color = colDown;
  // coincident knobs (e.g. (|←⟩+|→⟩)/√2): red knob big underneath, blue knob small on top
  // (downP comes later in the geometry list, so it is drawn and picked on top)
  upP.size = tpt(if(|upP.xy, downP.xy| < 0.15, 8, 5));
  downP.size = tpt(if(|upP.xy, downP.xy| < 0.15, 4, 5));

  fillcircle(c, r, color->cLightGray, alpha->.1);
  drawcircle(c, r, color->thCircLine,  alpha->.5);
  draw(c, upP,   color->colUp,   size->2);       // spokes
  draw(c, downP, color->colDown, size->2);

  // map knob positions to complex amplitudes on the unit circle
  zUp   = (upP.xy   - c) / r;
  zDown = (downP.xy - c) / r;
  zUpS = zUp;  zDownS = zDown;      // remembered for layout changes
  complexUp   = zUp.x   + i*zUp.y;
  complexDown = zDown.x + i*zDown.y;

  // phases (CCW) and relative phase; CindyScript: arctan2(x, y) = angle of the point (x, y)
  thetaUp   = arctan2(re(complexUp),   im(complexUp));
  thetaDown = arctan2(re(complexDown), im(complexDown));
  dTheta    = wrapPi(thetaDown - thetaUp);

  // the start particle; exact preset values when the knobs sit on a preset (removes projection round-off)
  particle       = [complexUp, complexDown];
  forall(1..4, kPre, if(startActive(kPre),
    particle = [startPre_kPre_1_1 + i*startPre_kPre_1_2, startPre_kPre_2_1 + i*startPre_kPre_2_2]));
  initState_mid  = particle;

  // labels: component legend right of the circle, relative phase under it
  cxy = c.xy;  rx = cxy_1 + r + 0.3;
  drawtext((rx, cxy_2 + 0.3), "● |←⟩", align->"left", size->fs(fsLab), bold->true, color->colUp);
  drawtext((rx, cxy_2 - 0.05), "● |→⟩", align->"left", size->fs(fsLab), bold->true, color->colDown);
  // relative phase is undefined if one amplitude vanishes
  dtTxt = if(abs(complexUp) < 1e-6 % abs(complexDown) < 1e-6, "Δθ: –", "Δθ ≈ " + formatPi(dTheta));
  drawtext((cxy_1, cxy_2 - r - 0.38), dtTxt, align->"center", size->fs(fsLab + 1), bold->true, color->thFg);
);

// ---------------------------------------------------------------------
// CARD 4: N slider and q slider of the Galton board
// ---------------------------------------------------------------------
// N slider (rail centre x, top yt of the card)
makeNslider(x, yt, l) := (
  regional(lx, yN, sN, eN, M, stepLbl, kMax, k, tNraw, Nraw, tN, kClr);
  lx = x - 0.5*cdInW() + cdPad;
  yN = yt - 1.5;
  sN = (x - 0.5*l, yN);
  eN = (x + 0.5*l, yN);
  draw(sN, eN, color->colSlN, size->2);

  // ticks/labels: 0, 50, 100, ... (M = maxmaxSteps)
  M = nLimit();  stepLbl = 50;      // rail range: 0..N limit of the current mode
  kMax = floor(M/stepLbl);
  if(animOn,
    forall(0..M, k, if(mod(k, 5) == 0, cdTick(sN.x + (k/M)*l, yN, "" + k, colSlN), draw((sN.x + (k/M)*l, yN + 0.06), (sN.x + (k/M)*l, yN - 0.06), color->colSlN))),   // tick every step, label every 5
    forall(0..kMax, k, cdTick(sN.x + (k*stepLbl/M)*l, yN, "" + (k*stepLbl), colSlN)));
  if(!animOn & mod(M, stepLbl) != 0, cdTick(eN.x, yN, "" + M, colSlN));

  // handle + integer snap
  slMaxStepP.color = colSlN;
  slMaxStepP.y = yN;
  slMaxStepP.x = min(eN.x, max(sN.x, slMaxStepP.x));
  tNraw = |slMaxStepP, sN|/l;
  Nraw  = min(M, max(0, round(tNraw * M)));
  tN    = Nraw/M;
  slMaxStepP.x = sN.x + tN*l;
  // N decreased: forget measurement flags of rows that are no longer visible
  // (position rows > N, coin rows > N); the key change in msUpdate() resets caches
  if(Nraw < stN,
    forall((Nraw + 1)..maxmaxSteps, kClr, (
      msRowsU_kClr = 0;
      msCoinU_(kClr + 1) = 0;
    ))
  );
  maxSteps = Nraw;
  stN = Nraw;

  drawtext((lx, yt - 1.05), tr("stepsTitle") + " N = " + maxSteps, align->"left", size->fs(fsLab), bold->true, color->colSlN);
);

// q slider of the Galton board (only drawn while the board is on; its space is always reserved)
makeQslider(x, yt, l) := (
  regional(lx, yq, qS, qE, kq, t, lab, val, szq, wTot);
  if(!gauss,
    (slQP.xy = (layXl - 20, layYt + 20)),     // handle parked outside the window
    (
      lx = x - 0.5*cdInW() + cdPad;
      yq = yt - 3.3;
      qS = (x - 0.5*l, yq);  qE = (x + 0.5*l, yq);
      draw(qS, qE, color->colGauss, size->2);
      forall([0, 0.25, 0.5, 0.75, 1], kq, cdTick(qS.x + kq*l, yq, if(kq == 0, "0", if(kq == 1, "1", format(kq, 2))), colGauss));
      slQP.color = colGauss;
      slQP.y = yq;
      slQP.x = min(qE.x, max(qS.x, slQP.x));
      t = snapFrac(|slQP, qS| / l);
      slQP.x = qS.x + t*l;
      stQ = t;
      lab = tr("galtonQ");  val = "q = " + uiFmt2(stQ);
      // label (left) and value (right) on one line; the font shrinks if both do not fit the card
      wTot = 0.58*(length(lab) + length(val) + 1);
      szq = min(fs(fsTxt), (cdInW() - 2*cdPad)*screenresolution()/wTot);
      drawtext((lx, yt - 2.9), lab, align->"left", size->szq, color->thMuted);
      drawtext((lx + cdInW() - 2*cdPad, yt - 2.9), val, align->"right", size->szq, bold->true, color->colGauss);
    )
  );
);

// ---------------------------------------------------------------------
// MEASUREMENT PANEL (card 5, always reserved, drawn only while a measurement kind is on).
// Three sections: "what is measured" (a), "runs" (b), "legend" (c). Placement by card width:
// 3 columns (flat row, a | b | c), 2 columns (a over b | c), 1 column (a, b, c stacked).
// All rows sit on one grid: row pitch msRH, label column, chips of equal height.
// ---------------------------------------------------------------------
msRH0 = 0.55;   // header baseline -> first row baseline
msRH = 0.62;    // row pitch (chip height + gap)

// strict grid: ONE label column (right-aligned labels) and ONE content column (all chips start at the
// same x). Chips of a group share a width: msGU for the small chips (all / none / +1 / +100), msGS = 2*msGU + gap for
// the spanning chips (re-roll, reset). Set once per frame in msDrawPanel().
msGP = 0.12;  msGU = 0.9;  msGS = 1.9;
msSecW = 3;                                  // width of section b (set by msDrawPanel; the speed rail uses it)
msBH() := msRH0 + 2*msRH;      // height of section b below its header

// measurement card: columns (3 / 2 / 1) and, for a full-width row, its height
layMsCols(wc) := if(wc >= cdMs3W, 3, if(wc >= cdMs2W, 2, 1));
layMsCardH(wc) := if(wc >= cdMs3W, cdMsH, if(wc >= cdMs2W, cdCH, cdMs1H));

msHdr(x, y, txt) := drawtext([x, y], txt, align->"left", size->fs(fsTick + 1), bold->true, color->colMs);

// one legend row. kinds: 1 filled square, 2 dot, 3 triangle, 4 grey box (coin fixed), 5 filled bar of 64 % width (violet ensemble),
// 6 filled bar of 40 % width (green Galton board). Swatches imitate the drawing in the histogram.
msLegRow(x, y, kind, col, txt, maxW) := (
  regional(sz, hs, cy);
  sz = min(fs(10), maxW*screenresolution()/(0.58*length(txt)));
  hs = 0.08;  cy = y + 0.3*sz/screenresolution();
  if(kind == 1, fillpoly([[x-hs,cy-hs],[x+hs,cy-hs],[x+hs,cy+hs],[x-hs,cy+hs]], color->col, alpha->1));
  if(kind == 5, fillpoly([[x-0.64*hs,cy-hs],[x+0.64*hs,cy-hs],[x+0.64*hs,cy+hs],[x-0.64*hs,cy+hs]], color->col, alpha->.85));
  if(kind == 6, fillpoly([[x-0.4*hs,cy-hs],[x+0.4*hs,cy-hs],[x+0.4*hs,cy+hs],[x-0.4*hs,cy+hs]], color->col, alpha->1));
  if(kind == 2, (fillcircle([x,cy], hs*0.8, color->thPaper, alpha->1); fillcircle([x,cy], hs*0.65, color->col, alpha->1)));
  if(kind == 4, (
    fillpoly([[x-hs,cy-hs],[x+hs,cy-hs],[x+hs,cy+hs],[x-hs,cy+hs]], color->(.55,.55,.55), alpha->.5);
    draw([x-hs,cy-hs],[x+hs,cy-hs], color->(.55,.55,.55), size->1);
    draw([x+hs,cy-hs],[x+hs,cy+hs], color->(.55,.55,.55), size->1);
    draw([x+hs,cy+hs],[x-hs,cy+hs], color->(.55,.55,.55), size->1);
    draw([x-hs,cy+hs],[x-hs,cy-hs], color->(.55,.55,.55), size->1);
  ));
  if(kind == 7, (
    draw([x-hs,cy-hs],[x-0.3*hs,cy-hs], color->colUp, size->1.3);  draw([x+0.3*hs,cy-hs],[x+hs,cy-hs], color->colDown, size->1.3);
    draw([x-hs,cy+hs],[x-0.3*hs,cy+hs], color->colUp, size->1.3);  draw([x+0.3*hs,cy+hs],[x+hs,cy+hs], color->colDown, size->1.3);
  ));
  if(kind == 3, (
    fillpoly([[x-hs-0.02,cy-hs-0.025],[x+hs+0.02,cy-hs-0.025],[x,cy+hs+0.04]], color->thPaper, alpha->1);
    fillpoly([[x-hs,cy-hs],[x+hs,cy-hs],[x,cy+hs]], color->col, alpha->1);
    drawpoly([[x-hs,cy-hs],[x+hs,cy-hs],[x,cy+hs]], color->thFg, size->1);
  ));
  drawtext([x + 0.22, y], txt, align->"left", size->sz, color->thFg);
);

// section a: returns the baseline of its last row
msSecA(x, y, wl) := (
  regional(yy, nr, nc, cx0);
  msHdr(x, y, tr("msSecWhat"));
  yy = y;  cx0 = x + wl + 0.15;
  nr = if(maxSteps > 0, sum(apply(1..maxSteps, k, msRowsU_k)), 0);
  nc = sum(apply(1..(maxSteps + 1), k, msCoinU_k));
  uiForceW = msGU;
  // "alle" / "keine" show the state: all rows (<= N) of that kind measured / none; neither if set individually
  if(msPosOn, (
    yy = yy - if(yy == y, msRH0, msRH);
    drawtext([x + wl, yy], tr("msPosLab"), align->"right", size->fs(fsTxt), bold->true, color->colMs);
    uiChipC([cx0, yy], tr("msAll"), maxSteps > 0 & nr == maxSteps, "msAll", "left", colMs, fsTxt);
    uiChipC([cx0 + msGU + msGP, yy], tr("msNone"), nr == 0, "msNone", "left", colMs, fsTxt);
  ));
  if(msCoinOn, (
    yy = yy - if(yy == y, msRH0, msRH);
    drawtext([x + wl, yy], tr("msCoinLab"), align->"right", size->fs(fsTxt), bold->true, color->colMs);
    uiChipC([cx0, yy], tr("msAll"), nc == maxSteps + 1, "mcAll", "left", colMs, fsTxt);
    uiChipC([cx0 + msGU + msGP, yy], tr("msNone"), nc == 0, "mcNone", "left", colMs, fsTxt);
  ));
  uiForceW = 0;
  yy
);

// section b: single run + collecting (three grid rows); returns the baseline of its last row
msSecB(x, y, wl) := (
  regional(yy, cx0);
  msHdr(x, y, tr("msSecRuns"));
  cx0 = x + wl + 0.15;
  yy = y - msRH0;
  drawtext([x + wl, yy], tr("msSingle"), align->"right", size->fs(fsTxt), bold->true, color->colMs);
  uiForceW = msGS;
  uiChipC([cx0, yy], tr("msRoll"), false, "msRoll", "left", colMs, fsTxt);
  yy = yy - msRH;
  drawtext([x + wl, yy], tr("msMany"), align->"right", size->fs(fsTxt), bold->true, color->colMs);
  uiForceW = msGU;
  uiChipC([cx0, yy], "+1", false, "ms1", "left", colMs, fsTxt);
  uiChipC([cx0 + msGU + msGP, yy], "+100", false, "ms100", "left", colMs, fsTxt);
  yy = yy - msRH;
  drawtext([x + wl, yy], "n = " + msN + if(msPending > 0, " …", ""), align->"right", size->fs(fsTxt), bold->true, color->colMs);
  uiForceW = msGS;
  uiChipC([cx0, yy], tr("msReset"), false, "msReset", "left", colMs, fsTxt);
  uiForceW = 0;
  yy
);

// section c: legend rows exactly as drawn in the histogram (swatch column at the section's left edge, texts aligned);
// only the rows that currently apply. yBot: baseline of the lowest toggle chip (they are anchored at the bottom of the
// card; if the legend is longer they follow it instead; yBot = 1e9 stacks them directly under the legend).
msSecL(x, y, lw, yBot) := (
  regional(yy, ds, lastM, anyM, xs, tw, wt, yE, yM);
  msHdr(x, y, tr("msSecLeg"));
  yy = y - msRH0;  ds = 0.32;  xs = x + 0.1;  tw = lw - 0.32;
  anyM = msAnyMeas();
  lastM = anyM & maxSteps > 0 & msRows_maxSteps == 1;
  if(lastM,
    (msLegRow(xs, yy, 3, thOrange, tr("msLegOut"), tw); yy = yy - ds),
    (msLegRow(xs, yy, 1, colDist, tr("msLegRun"), tw); yy = yy - ds)
  );
  if(anyM & msExOn, (msLegRow(xs, yy, 5, colMs, tr("msLegEns") + if(msEnsBusy, " " + tr("msBusy"), ""), tw); yy = yy - ds));
  if(msN > 0, (msLegRow(xs, yy, 2, colMsDark, tr("msLegFreq"), tw); yy = yy - ds));
  if(gauss, (msLegRow(xs, yy, 6, colGauss, tr("msLegGalton"), tw); yy = yy - ds));
  if(msFixAny() & msPosOn & msCoinOn, (msLegRow(xs, yy, 4, colMs, tr("msLegFix"), tw); yy = yy - ds));
  if(msMiniOn, (msLegRow(xs, yy, 1, colDist, tr("msLegMini"), tw); yy = yy - ds));
  if(msCoinOn, (msLegRow(xs, yy, 7, colUp, tr("msLegFrame"), tw); yy = yy - ds));
  // display toggles (violet chips of equal width, one column, left edge = section edge)
  wt = max(uiChipW(tr("msExChip"), fsTxt), uiChipW(tr("msMiniChip"), fsTxt));
  yE = min(yy - 0.3, yBot + msRH);
  yM = yE - msRH;
  uiForceW = wt;
  uiChipC([x, yE], tr("msExChip"), msExOn, "mx", "left", colMs, fsTxt);
  uiChipC([x, yM], tr("msMiniChip"), msMiniOn, "mm", "left", colMs, fsTxt);
  uiForceW = 0;
);

msDrawPanel() := (
  regional(x0, yt, wc, hc, nCol, gt, colw, xc1, xc2, xc3, y0, wl, yy, ye, yb0, yB, t);
  x0 = layCard_5_1;  yt = layCard_5_2;  wc = layCard_5_3;  hc = layCard_5_4;
  nCol = layMsCols(wc);
  gt = 0.3;
  colw = (wc - 2*cdPad - (nCol - 1)*gt)/nCol;
  xc1 = x0 + cdPad;  xc2 = xc1 + colw + gt;  xc3 = xc2 + colw + gt;
  y0 = yt - 1.0;
  // label column: the longest label (current language); chip widths: one unit for all small chips
  wl = 0.6*fs(fsTxt)*max(apply([tr("msPosLab"), tr("msCoinLab"), tr("msSingle"), tr("msMany"), "n = 000 …"], t, length(t)))/screenresolution() + 0.1;
  msGU = max(0.6, max(apply([tr("msAll"), tr("msNone"), "+100"], t, uiChipW(t, fsTxt))));
  msGU = max(msGU, (max(uiChipW(tr("msRoll"), fsTxt), uiChipW(tr("msReset"), fsTxt)) - msGP)/2);
  msGS = 2*msGU + msGP;
  msSecW = colw;
  ye = yt - hc + 0.2;                                  // lower end of vertical separators
  yb0 = yt - hc + 0.4;                                 // baseline of the lowest chip row (bottom anchor)
  if(nCol == 3,
    (
      msSecA(xc1, y0, wl);
      msSecB(xc2, y0, wl);
      draw([xc3 - gt/2, yt - 0.85], [xc3 - gt/2, ye], color->colMs, alpha->.35, size->1);
      msSecL(xc3, y0, x0 + wc - cdPad - xc3, yb0);
    ),
    if(nCol == 2,
      (
        // left column: "what is measured" at the top, "runs" anchored at the bottom; right column: legend on top, toggles at the bottom
        yy = msSecA(xc1, y0, wl);
        yB = min(yy - 0.6, yb0 + msBH());
        msSecB(xc1, yB, wl);
        draw([xc2 - gt/2, yt - 0.85], [xc2 - gt/2, ye], color->colMs, alpha->.35, size->1);
        msSecL(xc2, y0, x0 + wc - cdPad - xc2, yb0);
      ),
      (
        yy = msSecA(xc1, y0, wl);
        yy = msSecB(xc1, yy - 0.6, wl);
        draw([xc1, yy - 0.5], [xc1 + colw, yy - 0.5], color->colMs, alpha->.35, size->1);
        msSecL(xc1, yy - 0.85, colw, 1e9);
      )
    )
  );
);

// ---------------------------------------------------------------------
// ANIMATION CARD (card 5 slot in animation mode): speed slider (exponential, 12 s ... 0.8 s per step),
// pause / resume chip and a hint that measurements are not available. The content block is centred vertically.
// ---------------------------------------------------------------------
makeSpeedslider(x, yS, l) := (
  regional(sS, sE, tSp, labelY);
  sS = (x - 0.5*l, yS);  sE = (x + 0.5*l, yS);
  draw(sS, sE, color->colSlN, size->2);
  slSpP.color = colSlN;
  slSpP.y = yS;
  // the rail moved (layout, panel variant): re-place the handle from the stored fraction
  if(abs(sS_1 - spX0) > 1e-9 % abs(l - spL) > 1e-9, (slSpP.x = sS_1 + stSp*l; spX0 = sS_1; spL = l));
  slSpP.x = min(sE_1, max(sS_1, slSpP.x));
  tSp = abs(slSpP.x - sS_1)/l;
  stSp = tSp;                                          // animLength / waittime are derived from stSp in animTick
  labelY = yS - 0.5;                                   // slow (left) | seconds per step (centre) | fast (right)
  drawtext((sS_1, labelY), tr("animSlow"), align->"left", size->fs(fsTxt), color->thMuted);
  drawtext((x, labelY), format(animLength, 1) + tr("animPerStep"), align->"mid", size->fs(fsTxt), bold->true, color->colSlN);
  drawtext((sE_1, labelY), tr("animFast"), align->"right", size->fs(fsTxt), color->thMuted);
);

animDrawPanel() := (
  regional(x, yS);
  x = cdCx(5);  yS = cdTop(5) - 1.5 - max(0, (layCard_5_4 - 3.9)/2);       // content block centred vertically
  makeSpeedslider(x, yS, layRail());
  uiChipC((x, yS - 1.1), if(animrun, tr("animPause"), tr("animResume")), !animrun, "anim", "mid", colNeutral, fsTxt);
  drawtext((x, yS - 1.9), tr("animNoMs"), align->"mid",
    size->min(fs(fsTxt), (layCard_5_3 - 2*cdPad)*screenresolution()/(0.58*length(tr("animNoMs")))), color->thMuted);
);

// tab bar of the tab layout (phones): 5 equal chips, active one filled; actions "tab1".."tab5"
drawTabBar() := (
  regional(labs, cols, gp, wc, fz, mx, kk, szw, chip0, lab, nR, per, rh, row, nIn, wr, ci, ex);
  labs = [tr("tabCoin"), tr("tabMatrix"), tr("tabStart"), tr("tabWalk"), if(animOn, tr("cardAnim"), tr("tabMs"))];
  cols = [colCoinCard, colCoinCard, colNeutral, colNeutral, if(animOn, colNeutral, colMs)];
  gp = 0.12;
  nR = layTabRows;  per = if(nR == 2, 3, 5);                          // chips in the first row
  rh = (layTabR_4 - (nR - 1)*gp)/nR;                                  // chip row height
  wc = (layTabR_3 - (per - 1)*gp)/per;                                // narrowest chip
  mx = max(apply(labs, lab, length(lab)));
  fz = min(15, wc*screenresolution()/(layKs*(0.6*mx + 1.2)));       // font (in design px) so that the longest label fits
  szw = fs(fz)/screenresolution();
  ex = if(touchOn & nR == 1, min(0.3, max(0, cdTouchChipPx/screenresolution() - rh)), 0);   // touch: grow into the gaps above / below the bar
  rh = rh + ex;
  chip0 = cdChipH;  cdChipH = rh;                                     // taller chips for fingers
  uiNoGrow = true;
  forall(1..5, kk,
    row = floor((kk - 1)/per);  ci = kk - 1 - row*per;
    nIn = if(row == 0, per, 5 - per);                                 // chips in this row (they share its width)
    wr = (layTabR_3 - (nIn - 1)*gp)/nIn;
    uiForceW = wr;
    uiChipC((layTabR_1 + ci*(wr + gp), layTabR_2 - ex/6 + (nR - 1 - row)*(rh + gp) + (rh - 0.7*szw)/2), labs_kk, layTab == kk, "tab" + kk, "left", cols_kk, fz));
  uiForceW = 0;  cdChipH = chip0;  uiNoGrow = false;
);

// ---------------------------------------------------------------------
// all cards, in reading order: coin -> start -> walk -> measurement (called every frame)
// (tab layout: only the selected card is drawn, so the handles of hidden cards are neither moved nor shown)
// ---------------------------------------------------------------------
drawCards() := (
  regional(msFz, msW1, msW2, msX0, msOffT);
  if(layTabs, drawTabBar());
  if(cardShown(1), (
    cdFrame(1, tr("cardCoin"), colCoinCard);
    makeslider(cdCx(1), cdTop(1), layRail());
  ));
  if(cardShown(2), (
    cdFrame(2, tr("cardMatrix"), colCoinCard);
    drawCoinMatrix(cdCx(2), cdTop(2));
    drawCoinChips(cdCx(2), cdTop(2) - 3.5);
  ));
  if(cardShown(3), (
    cdFrame(3, tr("initPhaseTitle"), colNeutral);
    initphase(IC, initphaseR);
    drawStartChips(cdCx(3), cdTop(3) - 4.2);
  ));
  if(cardShown(4), (
  cdFrame(4, tr("cardWalk"), colNeutral);
  makeNslider(cdCx(4), cdTop(4), layRail());
  // animation mode toggle: right edge at the card's inner right edge, centred on the title line, clear of the divider
  uiForceW = uiChipW("✓ " + tr("animChip"), fsTxt);
  uiOff = msOn;        // greyed out while a measurement kind is on
  uiChipC((layCard_4_1 + layCard_4_3 - cdPad, layCard_4_2 - 0.42), if(animOn, "✓ ", "") + tr("animChip"), animOn, "animmode", "right", colNeutral, fsTxt);
  uiOff = false;
  uiForceW = 0;
  // Galton board chip + its q slider (space of the slider is always reserved)
  uiForceW = uiChipW("✓ " + tr("galtonChip"), fsTxt);
  uiChipC((cdCx(4), cdTop(4) - 2.45), if(gauss, "✓ ", "") + tr("galtonChip"), gauss, "binom", "mid", colGauss, fsTxt);
  uiForceW = 0;
  makeQslider(cdCx(4), cdTop(4), layRail());
  // measurement kinds: two independent toggles side by side (font shrinks if the labels are long)
  msFz = min(fsTxt, (cdInW() - 0.7)*layKRef/(0.6*(length(tr("msChipPos")) + length(tr("msChipCoin"))) + 2.4));
  msW1 = uiChipW(tr("msChipPos"), msFz);  msW2 = uiChipW(tr("msChipCoin"), msFz);
  msX0 = cdCx(4) - (msW1 + msW2 + 0.12)/2;
  uiOff = animOn;      // greyed out and not clickable in animation mode (flags are kept)
  uiChipC((msX0, cdTop(4) - 4.25), tr("msChipPos"), msPosOn, "mp", "left", colMs, msFz);
  uiChipC((msX0 + msW1 + 0.12, cdTop(4) - 4.25), tr("msChipCoin"), msCoinOn, "mk", "left", colMs, msFz);
  uiOff = false;
  ));
  // measurement card: always framed (its space is reserved); content only while a measurement kind is on
  if(cardShown(5), (
  cdFrame(5, if(animOn, tr("cardAnim"), tr("msTitle")), if(animOn, colNeutral, colMs));
  if(animOn, animDrawPanel(),
  if(msOn,
    msDrawPanel(),
    (
      msOffT = tr("msOffHint");
      drawtext([layCard_5_1 + layCard_5_3/2, layCard_5_2 - layCard_5_4/2], msOffT, align->"mid",
        size->min(fs(fsTxt), (layCard_5_3 - 2*cdPad)*screenresolution()/(0.58*length(msOffT))), color->(.55,.55,.55));
    )));
  ));
);


// =====================================================================
// 8  LAYOUT COMPUTATION
// =====================================================================
// needed size [width, height] (world units) of arrangement k   (must match qwDims)
layDims(k) := (
  regional(c, r, pl, sm, bw, bh, wt, wn, hn, dW, dH);
  c = layCands_k_1;  r = layCands_k_2;  pl = layCands_k_3;  sm = layCands_k_4;
  bw = c*cdCW + (c - 1)*cdGap;  bh = r*cdCH + (r - 1)*cdGap;       // size of the card block
  wt = cdWalkTop;
  if(sm == 3 & pl == 1,
    (
      // T2: tabs beside the walk: left column = two-row tab bar + one card (width cdCW)
      dW = 2*cdMg + cdCW + cdWalkGap + cdChkW + cdRm;
      wn = dW + cdTabWalkW;
      dH = wt + cdMg + cdFootH;
      hn = max(cdTitleH + cdTabH2 + max(cdCH, layMsCardH(cdCW)) + cdMg, dH + cdWalkMinH);
    ),
  if(sm == 3,
    (
      // T1: tabs below the walk: one card (full width); its height is the larger of cdCH and the measurement card
      dW = 2*cdMg + cdChkW + cdRm;
      wn = max(dW + cdTabWalkW, 2*cdMg + cdCW);
      hn = wt + cdWalkMinH + cdWalkGap + cdTabH + max(cdCH, layMsCardH(wn - 2*cdMg)) + 0.15 + cdFootH + cdMg;
    ),
  if(pl == 0,
    (
      // B, C: block below the walk, measurement card as a row under it
      dW = 2*cdMg + cdChkW + cdRm;
      wn = max(dW + cdWalkMinW, 2*cdMg + bw);
      hn = wt + cdWalkMinH + cdWalkGap + cdHasMs*(layMsCardH(bw) + cdGap) + bh + 0.15 + cdFootH + cdMg;
    ),
    (
      // A: block left of the walk, measurement card below the block
      dW = 2*cdMg + bw + cdWalkGap + cdChkW + cdRm;
      wn = dW + cdWalkMinW;
      dH = wt + cdMg + cdFootH;
      hn = max(cdTitleH + bh + cdGap + cdMsBelowH + cdMg, dH + cdWalkMinH);
    )
  )));
  [wn, hn]
);

// kd(k): pixels per unit that arrangement k achieves in a window of wpx x hpx pixels   (must match qwKdOf)
layKd(k, wpx, hpx) := (
  regional(d);
  d = layDims(k);
  min(cdKdMax, min(wpx/d_1, hpx/d_2))
);

// The arrangement rule: returns [index, pixels per unit] for a window of wpx x hpx CSS pixels.
// Decision chain (A, B, C, T1, T2: see section 3; an arrangement "fits" if its kd >= cdTabKd):
//   1. landscape = (width >= height)
//   2. narrower than cdTabMaxPx: tabs (landscape: T2 beside, portrait: T1 below)
//   3. landscape: A if it fits, else T2
//   4. portrait: B if it fits, else C if it fits, else T1
// Tabs are the fallback and are used even when they stay small (kd is never below cdMinKd).
// (the JS part mirrors this: qwKd / qwKdOf / qwDims must match layPick / layKd / layDims)
layPick(wpx, hpx) := (
  regional(land, sel);
  land = (wpx >= hpx);
  sel = if(land, 5, 4);                                              // tabs
  if(wpx >= cdTabMaxPx,
    if(land,
      if(layKd(1, wpx, hpx) >= cdTabKd, sel = 1),
      if(layKd(2, wpx, hpx) >= cdTabKd, sel = 2,
        if(layKd(3, wpx, hpx) >= cdTabKd, sel = 3))));
  [sel, max(cdMinKd, layKd(sel, wpx, hpx))]
);

// positions of the cards and the walk rectangle for the current window (called every frame)
computeLayout() := (
  regional(sb, w, h, kpx, pk, arr, lyC, lyR, lyPl, xA, xB, yBot, lyBH, walkX0, footAvail, fbH,
           gy0, lyMsH, lyW, lyBW, lyX, lyT, wAv, hAv, cxW, kk, lyTabs, lyTB);
  sb = screenbounds();
  layXl = sb_1_1;  layYt = sb_1_2;
  layXr = sb_3_1;  layYb = sb_3_2;
  w = layXr - layXl;  h = layYt - layYb;
  kpx = screenresolution();
  layKs = max(.45, min(1.45, kpx/layKRef));
  // before the canvas has a size (hidden tab, first frame) nothing may be computed: NaN would poison the handles
  layOk = (kpx > 1) & (w > 2) & (h > 2);
  if(!layOk, (layChanged = false; return()));

  layChanged = (abs(layXl-layXlp) > 1e-6) % (abs(layXr-layXrp) > 1e-6)
             % (abs(layYt-layYtp) > 1e-6) % (abs(layYb-layYbp) > 1e-6);
  layXlp = layXl; layXrp = layXr; layYtp = layYt; layYbp = layYb;

  pk = layPick(round(w*kpx), round(h*kpx));
  arr = pk_1;
  lyC = layCands_arr_1;  lyR = layCands_arr_2;  lyPl = layCands_arr_3;
  lyTabs = layCands_arr_4 == 3;
  if(lyTabs != layTabs, (layTabs = lyTabs; layChanged = true));

  xA = layXl + cdMg;   xB = layXr - cdMg;   yBot = layYb + cdMg;
  lyBH = lyR*cdCH + (lyR - 1)*cdGap;                  // height of the card block

  // footer: how many text lines are needed for the available width
  walkX0 = xA + lyC*cdCW + (lyC - 1)*cdGap + cdWalkGap;
  footAvail = if(lyPl == 1, xB - walkX0, xB - xA);
  layFootLines = if(footAvail >= 9.9, 2, 3);
  layFootX = xB;  layFootY = yBot;
  fbH = 0.2 + 0.26*layFootLines;

  layTabRows = if(lyTabs & lyPl == 1, 2, 1);
  if(lyTabs & lyPl == 1,
    (
      // tabs beside the walk: left column = two-row tab bar on top + the shared card slot (width cdCW); spare height centres it
      lyMsH = max(cdCH, layMsCardH(cdCW));
      gy0 = layYt - cdTitleH;
      gy0 = gy0 - max(0, gy0 - yBot - cdTabH2 - lyMsH)/2;
      lyTB = gy0 - cdTabH2;                                  // top of the card slot
      layCard = apply(1..5, kk, [xA, lyTB, cdCW, lyMsH]);
      layTabR = [xA, lyTB + 0.1, cdCW, cdTabH2 - 0.2];
      layWalkBL = [walkX0 + cdChkW, yBot + fbH];
      layWalkTR = [xB - cdRm, layYt - cdWalkTop];
    ),
  if(lyTabs,
    (
      // tabs: all five cards share one rectangle at full width under the walk; the tab bar sits between walk and card
      lyW = xB - xA;
      lyMsH = max(cdCH, layMsCardH(lyW));
      lyT = yBot + fbH + 0.15 + lyMsH;
      layCard = apply(1..5, kk, [xA, lyT, lyW, lyMsH]);
      layTabR = [xA, lyT + 0.1, lyW, cdTabH - 0.2];
      layWalkBL = [xA + cdChkW, lyT + cdTabH + cdWalkGap];
      layWalkTR = [xB - cdRm, layYt - cdWalkTop];
    ),
  if(lyPl == 1,
    (
      // block left (cards at their natural width)
      gy0 = layYt - cdTitleH;
      // A: left column = card block + measurement card below it (same width, fills the remaining height up to
      // cdMsBelowMaxH); spare height centres the whole column vertically; the walk takes the rest to the right
      lyMsH = max(cdMsBelowH, min(cdMsBelowMaxH, gy0 - yBot - lyBH - cdGap));
      gy0 = gy0 - max(0, gy0 - yBot - lyBH - cdGap - lyMsH)/2;
      layCard = apply(1..4, kk,
        [xA + mod(kk - 1, lyC)*(cdCW + cdGap), gy0 - floor((kk - 1)/lyC)*(cdCH + cdGap), cdCW, cdCH]);
      layCard = layCard ++ [[xA, gy0 - lyBH - cdGap, lyC*cdCW + (lyC - 1)*cdGap, lyMsH]];
      layWalkBL = [walkX0 + cdChkW, yBot + fbH];
      layWalkTR = [xB - cdRm, layYt - cdWalkTop];
    ),
    (
      // B, C: block under the walk, cards stretch to fill the width (up to cdCardMaxW); measurement card = full-width row under it
      lyBH = lyR*cdCH + (lyR - 1)*cdGap;
      lyW = min(cdCardMaxW, (xB - xA - (lyC - 1)*cdGap)/lyC);
      lyBW = lyC*lyW + (lyC - 1)*cdGap;                 // width of the card block
      lyX = (xA + xB)/2 - lyBW/2;
      lyMsH = layMsCardH(lyBW);
      lyT = yBot + fbH + 0.15 + lyMsH + cdGap + lyBH;   // top of the base-card block
      layCard = apply(1..4, kk,
        [lyX + mod(kk - 1, lyC)*(lyW + cdGap), lyT - floor((kk - 1)/lyC)*(cdCH + cdGap), lyW, cdCH]);
      layCard = layCard ++ [[lyX, yBot + fbH + 0.15 + lyMsH, lyBW, lyMsH]];
      layWalkBL = [xA + cdChkW, lyT + cdWalkGap];
      layWalkTR = [xB - cdRm, layYt - cdWalkTop];
    )
  )));
  // a very flat walk is not stretched further: narrow it symmetrically
  wAv = layWalkTR_1 - layWalkBL_1;  hAv = layWalkTR_2 - layWalkBL_2;
  if(cdWalkMaxAsp > 0 & hAv > 0 & wAv > cdWalkMaxAsp*hAv,
    (
      cxW = (layWalkBL_1 + layWalkTR_1)/2;
      layWalkBL = [cxW - 0.5*cdWalkMaxAsp*hAv, layWalkBL_2];
      layWalkTR = [cxW + 0.5*cdWalkMaxAsp*hAv, layWalkTR_2];
    )
  );
  if(layCard != layCardP % layTab != layTabP, (layChanged = true; layCardP = layCard; layTabP = layTab));

  // anchors of the handles
  layPY = cdTop(1) - 2.05;                      // p rail
  layPhY = cdTop(1) - 4.0;                      // phi rail
  layICx = cdCx(3) - 0.85;  layICy = cdTop(3) - 1.95;
  layNy = cdTop(4) - 1.5;                       // N rail
  layQy = cdTop(4) - 3.3;                       // q rail (Galton board)

  C1.xy  = layWalkBL;
  C2.xy  = layWalkTR;
  IC.xy  = (layICx, layICy);
);

// place all handles from the stored state (called after a layout change)
// (tab layout: handles of hidden cards are parked outside the window; stored state is not touched, so nothing changes)
layPark() := (layXl - 20, layYt + 20);
tpt(sz) := if(touchOn, cdTouchPt*sz, sz);                       // handle size (bigger on touch devices)
// touch flag from JS (coarse pointer): bigger handles (CindyJS has no separate grab tolerance: the point size is the grab radius)
touchSet(f) := (
  f = (f > 0);
  if(f != touchOn,
    (
      touchOn = f;
      slCoinpP.size = tpt(5);  slCoinPhiP.size = tpt(5);  slMaxStepP.size = tpt(5);  slSpP.size = tpt(5);  slQP.size = tpt(5);
      layChanged = true;
    ));
);
layRemap() := (
  slCoinpP.xy   = if(cardShown(1), (cdCx(1) - 0.5*layRail() + stP*layRail(),   layPY), layPark());
  slCoinPhiP.xy = if(cardShown(1), (cdCx(1) - 0.5*layRail() + stPhi*layRail(), layPhY), layPark());
  slMaxStepP.xy = if(cardShown(4), (cdCx(4) - 0.5*layRail() + (stN/nLimit())*layRail(), layNy), layPark());
  placeSpHandle();
  placeQHandle();
  upP.xy   = if(cardShown(3), (layICx, layICy) + initphaseR*zUpS, layPark());
  downP.xy = if(cardShown(3), (layICx, layICy) + initphaseR*zDownS, layPark());
);


// =====================================================================
// 9  URL PARAMETERS & LINK
// The JS part only hands over location.search / location.hash (cfgFromUrl) and shows the link panel (qwShowLink).
// Parsing the parameters and building the link are done here. Parameters (case-insensitive keys):
//   lang=de|en  coin=hadamard|bleiben|tauschen|komplex  p=0..1  phi=0..2 (multiples of pi)
//   start=left|right|plus|plusi  a=<complex> b=<complex> (start amplitudes, normalised)
//   mode=anim  speed=0.8..12 (seconds per step, animation mode; N is limited to cdAnimMaxN)  N=0..100  galton=1  q=0..1  ort=alle|keine|1-10,15  qubit=...  mittel=1  zeilen=1
// =====================================================================
coinNames = ["hadamard", "bleiben", "tauschen", "komplex"];      // names of the coin presets (coinPre)
startNames = ["left", "right", "plus", "plusi"];                  // names of the start presets (startPre)
strUpper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
strLowerCase = "abcdefghijklmnopqrstuvwxyz";
strDigits = "0123456789";
// ASCII characters 32..126 in order (quote and backslash replaced by "?"), for %XX decoding
strAscii = " !?#$%&'()*+,-./0123456789:;<=>?@" + strUpper + "[?]^_`" + strLowerCase + "{|}~";
urlPairs = [];       // [[key, value], ...] of the current URL

// ---- string helpers ----
// NOTE: tokenize() would turn numeric pieces into numbers, so strings are split by hand
strChars(s) := if(length(s) == 0, [], apply(1..length(s), k, substring(s, k - 1, k)));      // list of the characters ([] for "")
strSplit(s, sep) := (       // split at a single-character separator (empty pieces are kept)
  regional(parts, rest, p);
  parts = [];  rest = s;  p = indexof(rest, sep);
  while(p > 0, (
    parts = parts ++ [substring(rest, 0, p - 1)];
    rest = substring(rest, p, length(rest));
    p = indexof(rest, sep);
  ));
  parts ++ [rest]
);
strLower(s) := (
  regional(out, ch, k);
  out = "";
  forall(strChars(s), ch, (k = indexof(strUpper, ch); out = out + if(k > 0, substring(strLowerCase, k - 1, k), ch)));
  out
);
strJoin(list, sep) := (
  regional(out, k);
  out = "";
  if(length(list) > 0, forall(1..length(list), k, out = out + if(k > 1, sep, "") + list_k));
  out
);
isDigits(s) := (
  regional(ok, ch);
  ok = length(s) > 0;
  forall(strChars(s), ch, if(indexof(strDigits, ch) == 0, ok = false));
  ok
);
// remove leading "?" / "#" characters
urlStrip(s) := (
  regional(t);
  t = s;
  while(length(t) > 0 & (substring(t, 0, 1) == "?" % substring(t, 0, 1) == "#"), t = substring(t, 1, length(t)));
  t
);
// value of a hex digit character (0..15), -1 if it is none
hexVal(ch) := indexof("0123456789abcdef", strLower(ch)) - 1;
// %XX -> character (ASCII 32..126 only)
urlDecode(s) := (
  regional(out, k, n, c, h1, h2, code);
  out = "";  k = 1;  n = length(s);
  while(k <= n, (
    c = substring(s, k - 1, k);
    code = 0;
    if(c == "%" & k + 2 <= n, (
      h1 = hexVal(substring(s, k, k + 1));  h2 = hexVal(substring(s, k + 1, k + 2));
      if(h1 >= 0 & h2 >= 0, code = 16*h1 + h2);
    ));
    if(code >= 32 & code <= 126,
      (out = out + substring(strAscii, code - 32, code - 31); k = k + 3),
      (out = out + c; k = k + 1)
    );
  ));
  out
);

// "key=value&key2=value2" -> [[key (lower case), value], ...]; in values a space (from "+" or %20) is read as "+"
urlParse(raw) := (
  regional(pairs, tok, p, key, val);
  pairs = [];
  forall(strSplit(raw, "&"), tok, if(length(tok) > 0, (
    p = indexof(tok, "=");
    if(p == 0, (key = tok; val = ""), (key = substring(tok, 0, p - 1); val = substring(tok, p, length(tok))));
    pairs = pairs ++ [[strLower(urlDecode(key)), replace(urlDecode(val), " ", "+")]];
  )));
  pairs
);
urlHas(key) := length(select(urlPairs, pr, pr_1 == key)) > 0;
urlVal(key) := (        // last value of the key ("" if absent)
  regional(m);
  m = select(urlPairs, pr, pr_1 == key);
  if(length(m) > 0, m_(length(m))_2, "")
);

// ---- value parsers: return [] if invalid, otherwise [value] ----
// decimal number with optional sign and "." or "," (no exponent)
numParse(s) := (
  regional(t, sg, body, ok, dots, digs, ch);
  t = replace(s, ",", ".");
  sg = 1;  body = t;
  if(length(t) > 0 & (substring(t, 0, 1) == "-" % substring(t, 0, 1) == "+"),
    (if(substring(t, 0, 1) == "-", sg = -1); body = substring(t, 1, length(t))));
  ok = length(body) > 0;  dots = 0;  digs = 0;
  forall(strChars(body), ch,
    if(ch == ".", dots = dots + 1, if(indexof(strDigits, ch) > 0, digs = digs + 1, ok = false)));
  if(ok & dots <= 1 & digs >= 1,
    (
      if(substring(body, 0, 1) == ".", body = "0" + body);
      if(substring(body, length(body) - 1, length(body)) == ".", body = body + "0");
      [sg*parse(body)]
    ),
    []
  )
);
numIn(s, lo, hi) := (
  regional(r);
  r = numParse(s);
  if(length(r) == 1, if(r_1 >= lo & r_1 <= hi, r, []), [])
);

// complex number "0.5+0.5i", "0.6i", "-i", "0.8" -> [[re, im]] or []
cxParse(s) := (
  regional(t, terms, cur, ch, ok, re0, im0, term, n, c, v, k);
  t = replace(replace(replace(s, ",", "."), "I", "i"), " ", "");
  terms = [];  cur = "";  ok = length(t) > 0;
  forall(strChars(t), ch,
    if(ch == "+" % ch == "-",
      if(cur == "", cur = ch,
        if(cur == "+" % cur == "-", ok = false, (terms = terms ++ [cur]; cur = ch))),
      cur = cur + ch));
  if(cur == "" % cur == "+" % cur == "-", ok = false, terms = terms ++ [cur]);
  re0 = 0;  im0 = 0;
  if(ok, forall(terms, term, (
    n = length(term);
    if(substring(term, n - 1, n) == "i",
      (
        c = substring(term, 0, n - 1);
        v = if(c == "" % c == "+", [1], if(c == "-", [-1], numParse(c)));
        if(length(v) == 0, ok = false, im0 = im0 + v_1);
      ),
      (
        v = numParse(term);
        if(length(v) == 0, ok = false, re0 = re0 + v_1);
      )
    );
  )));
  if(ok, [[re0, im0]], [])
);

// row list "alle" | "keine" | "1-10,15" within lo..N -> [1, sorted list] or [0, []] if invalid
rowsParse(s, lo, N) := (
  regional(t, seen, ok, tok, parts, good, a, b, k);
  t = strLower(replace(s, " ", ""));
  if(t == "alle" % t == "all", [1, if(N >= lo, lo..N, [])],
    if(t == "keine" % t == "none", [1, []],
      (
        seen = apply(1..(N + 2), k, 0);          // seen_(k+1) = 1: row k selected
        ok = false;
        forall(strSplit(t, ","), tok, (
          parts = strSplit(tok, "-");
          good = if(length(parts) == 1, isDigits(parts_1),
                   if(length(parts) == 2, isDigits(parts_1) & isDigits(parts_2), false));
          if(good, (
            ok = true;
            a = parse(parts_1);  b = if(length(parts) == 2, parse(parts_2), a);
            if(max(lo, a) <= min(N, b), forall(max(lo, a)..min(N, b), k, seen_(k + 1) = 1));
          ));
        ));
        if(ok, [1, if(N >= lo, select(lo..N, k, seen_(k + 1) == 1), [])], [0, []])
      )
    )
  )
);

// set the start configuration from the URL (called once by JS after the CindyJS object exists)
cfgFromUrl(search, hash) := (
  regional(v, x, k, ca, cb, nrm, nn, rr);
  urlPairs = urlParse(urlStrip(search) + "&" + urlStrip(hash));
  nn = 5;                                              // N used to read row lists (default N)
  v = urlVal("lang");
  if(v == "de" % v == "en", lang = v);
  v = strLower(urlVal("theme"));
  if(v == "light", themeUser = 0);  if(v == "dark", themeUser = 1);
  v = strLower(urlVal("coin"));
  forall(1..4, k, if(coinNames_k == v, (stP = coinPre_k_1; stPhi = coinPre_k_2)));
  x = numIn(urlVal("p"), 0, 1);    if(length(x) == 1, stP = x_1);
  x = numIn(urlVal("phi"), 0, 2);  if(length(x) == 1, stPhi = x_1/2);
  v = strLower(urlVal("start"));
  forall(1..4, k, if(startNames_k == v, (zUpS = startPre_k_1; zDownS = startPre_k_2)));
  if(urlHas("a") % urlHas("b"),
    (
      ca = if(urlHas("a"), cxParse(urlVal("a")), [[0, 0]]);
      cb = if(urlHas("b"), cxParse(urlVal("b")), [[0, 0]]);
      if(length(ca) == 1 & length(cb) == 1, (
        nrm = sqrt(ca_1_1^2 + ca_1_2^2 + cb_1_1^2 + cb_1_2^2);
        if(nrm > 1e-12, (zUpS = ca_1/nrm; zDownS = cb_1/nrm));
      ));
    )
  );
  x = numIn(urlVal("n"), 0, 100);
  if(length(x) == 1, (nn = round(x_1); stN = nn; maxSteps = nn));
  x = numIn(urlVal("speed"), 0, 1e9);
  if(length(x) == 1, if(x_1 > 0, stSp = log(min(12, max(0.8, x_1))/12)/log(0.8/12)));
  v = urlVal("galton");  if(v == "1" % v == "true", gauss = true);
  x = numIn(urlVal("q"), 0, 1);    if(length(x) == 1, stQ = x_1);
  if(urlHas("ort"), (
    rr = rowsParse(urlVal("ort"), 1, nn);
    if(rr_1 == 1, (msRowsU = apply(1..maxmaxSteps, k, if(contains(rr_2, k), 1, 0)); msPosOn = true));
  ));
  if(urlHas("qubit"), (
    rr = rowsParse(urlVal("qubit"), 0, nn);
    if(rr_1 == 1, (msCoinU = apply(1..(maxmaxSteps + 1), k, if(contains(rr_2, k - 1), 1, 0)); msCoinOn = true));
  ));
  v = urlVal("mittel");  if(v == "1" % v == "true", msExOn = true);
  v = urlVal("zeilen");  if(v == "1" % v == "true", msMiniOn = true);
  // animation mode last: it wins over measurement parameters (the flags stay set but measurement is off)
  if(strLower(urlVal("mode")) == "anim", animSetMode(true));    // clamps N like the chip
  msSync();
  layChanged = true;
);

// ---- link: the current state as a query string ----
// number with at most 4 decimals, trailing zeros removed
linkNum(x) := (
  regional(k, ip, fp, str);
  k = round(abs(x)*10000);
  if(k == 0, "0",
    (
      ip = floor(k/10000);  fp = k - 10000*ip;
      str = "" + ip;
      if(fp > 0, (
        fp = "" + (10000 + fp);                       // "1dddd"
        fp = substring(fp, 1, 5);
        while(substring(fp, length(fp) - 1, length(fp)) == "0", fp = substring(fp, 0, length(fp) - 1));
        str = str + "." + fp;
      ));
      if(x < 0, "-", "") + str
    )
  )
);
// complex amplitude z = [re, im] -> "0.5+0.5i", "0.6i", "-i", "0.8"
linkCx(z) := (
  regional(re0, im0, is);
  re0 = if(abs(z_1) < 5e-5, 0, z_1);  im0 = if(abs(z_2) < 5e-5, 0, z_2);
  if(im0 == 0, linkNum(re0),
    (
      is = if(abs(im0 - 1) < 5e-5, "", if(abs(im0 + 1) < 5e-5, "-", linkNum(im0))) + "i";
      if(re0 == 0, is, linkNum(re0) + if(substring(is, 0, 1) == "-", "", "+") + is)
    )
  )
);
// list of selected rows -> "alle" | "keine" | ranges "1-3,7"
linkRows(l, lo, N) := (
  regional(n, out, i, j);
  n = length(l);
  if(n == 0, "keine",
    if(n == N - lo + 1, "alle",
      (
        out = [];  i = 1;
        while(i <= n, (
          j = i;
          while(j < n & l_(min(j + 1, n)) == l_j + 1, j = j + 1);
          out = out ++ [if(j > i, "" + l_i + "-" + l_j, "" + l_i)];
          i = j + 1;
        ));
        strJoin(out, ",")
      )
    )
  )
);

// query string (without "?") of the current state; presets are written by name, defaults are omitted
linkQuery() := (
  regional(q, hit, k);
  q = [];
  if(lang == "de", q = q ++ ["lang=de"]);   // only the non-default language goes into the link
  if(themeUser >= 0, q = q ++ ["theme=" + if(themeUser == 1, "dark", "light")]);     // only after an explicit choice
  hit = 0;  forall(1..4, k, if(hit == 0 & coinActive(k), hit = k));
  if(hit == 0, q = q ++ ["p=" + linkNum(stP), "phi=" + linkNum(2*stPhi)],
    if(hit != 1, q = q ++ ["coin=" + coinNames_hit]));
  hit = 0;  forall(1..4, k, if(hit == 0 & startActive(k), hit = k));
  if(hit == 0, q = q ++ ["a=" + linkCx(zUpS), "b=" + linkCx(zDownS)],
    if(hit != 4, q = q ++ ["start=" + startNames_hit]));
  if(animOn, q = q ++ ["mode=anim", "speed=" + linkNum(12*(0.8/12)^stSp)]);
  if(animOn & animNSaved > 0, q = q ++ ["N=" + animNSaved],
    if(stN != 5, q = q ++ ["N=" + stN]));
  if(gauss, q = q ++ ["galton=1", "q=" + linkNum(stQ)]);
  if(!animOn, (    // measurement and animation mode exclude each other
    if(msPosOn, q = q ++ ["ort=" + linkRows(if(maxSteps > 0, select(1..maxSteps, k, msRowsU_k == 1), []), 1, stN)]);
    if(msCoinOn, q = q ++ ["qubit=" + linkRows(select(0..maxSteps, k, msCoinU_(k + 1) == 1), 0, stN)]);
    if(msExOn, q = q ++ ["mittel=1"]);
    if(msMiniOn, q = q ++ ["zeilen=1"]);
  ));
  strJoin(q, "&")
);

// show the link in the HTML overlay (JS adds the page address in front)
linkOpen() := javascript("qwShowLink('" + linkQuery() + "','" + tr("linkHint") + "')");


// =====================================================================
// 10  START-UP: initial values of the slider-driven variables
// (the handles themselves are placed by layRemap() in the first frame)
// =====================================================================
histFrac = 0.28;    // share of the walk height used by the histogram
histGap  = 0.6;     // gap above the top row of the board: room for the measurement column headers (always reserved)
maxSteps = stN;
coinP = stP;
coinRot = 2*pi*stPhi;
coin = coinGen(coinP, coinRot);

javascript("qwReady()");      // tell the JS part that all definitions exist (it then sets the view and the URL configuration)
</script>
<script id="csdraw" type="text/x-cindyscript">
// main loop: layout -> header -> single run -> measurement bookkeeping -> board + histogram -> cards
uiHits = [];                     // click targets are collected while drawing
themeApply();
titleApply();
animTick();                      // animation clock and progress
fillpoly(screenbounds(), color->thBg, alpha->1);     // background (first thing drawn)
msOn = (msPosOn % msCoinOn) & !animOn;    // any measurement kind on (animation mode: measurement off, flags kept)
msEffective();                   // flags of a disabled kind are ignored (but kept)
computeLayout();
if(layChanged, layRemap());
drawTitle();
drawFooter();
computeSingleRun();              // fills walk, msOut, msPre
msUpdate();                      // invalidate / extend collected data and the exact ensemble
// the walk rectangle is given by the two (hidden) handles C1, C2
drawWalkInRectWithFrac(walk, [min(C1.x, C2.x), min(C1.y, C2.y)], [max(C1.x, C2.x), max(C1.y, C2.y)], histFrac, histGap);
drawCards();
loopSync();                      // the one place that starts / stops the CindyJS loop
</script>
<script id="csmouseup" type="text/x-cindyscript">
// click on a text chip: find the hit rectangle under the mouse and run its action
uiM = mouse();
uiBest = 1e9;  uiBestA = "";
forall(uiHits, uiH,
  if(uiM_1 >= uiH_1 & uiM_1 <= uiH_3 & uiM_2 >= uiH_2 & uiM_2 <= uiH_4,
    (
      uiD = ((uiM_1 - (uiH_1 + uiH_3)/2)/(uiH_3 - uiH_1))^2 + ((uiM_2 - (uiH_2 + uiH_4)/2)/(uiH_4 - uiH_2))^2;
      if(uiD < uiBest, (uiBest = uiD; uiBestA = uiH_5));
    ))
);
if(uiBestA != "", uiAct(uiBestA));
repaint();
</script>
<script type="text/javascript">
// =====================================================================
// JavaScript part: only what CindyScript cannot do.
//  1. Sizing the visible rectangle of the port (CindyScript can read screenbounds() but cannot set the viewport).
//     The scale kd is computed here BEFORE CindyJS starts by a small mirror of the arrangement rule (qwDims / qwKdOf / qwPick),
//     with all constants read from the csinit text, so they exist only once. computeLayout() then reads the
//     visible world with screenbounds() and runs the real layPick on it.
//  2. Passing location.search / location.hash to CindyScript (cfgFromUrl) once at start.
//  3. Showing the link overlay (an HTML element); the text is built by CindyScript (linkOpen).
//  4. Repaint workaround: CindyJS does not redraw on a plain click.
//  5. Delaying the start until the page has a real size.
// =====================================================================
var cdy = null;
var qwVR = [0, 0, 1, -1];     // visible rectangle of the port, mutated in place (CindyJS keeps a reference)

// constants parsed from the csinit text: lines "cdName = number;" and "layCands = [...];"
var QWC = {};
var qwCs = document.getElementById("csinit").textContent;
qwCs.replace(/^\s*(cd[A-Za-z0-9]+)\s*=\s*(-?[0-9.]+)\s*;/gm, function (m, k, v) { QWC[k] = parseFloat(v); return m; });
var QW_CANDS = JSON.parse(qwCs.match(/^\s*layCands\s*=\s*(\[\[.*?\]\])\s*;/m)[1]);

// Mirror of layDims / layKd / layPick (CindyScript): qwDims / qwKdOf / qwKd must match them.
// Card heights of the measurement card as in layMsCardH.
function qwMsCardH(wc) { var C = QWC; return wc >= C.cdMs3W ? C.cdMsH : (wc >= C.cdMs2W ? C.cdCH : C.cdMs1H); }
// needed [width, height] (world units) of arrangement cand = [columns, rows, place, ms] (layDims)
function qwDims(cand) {
  var C = QWC, c = cand[0], r = cand[1], pl = cand[2], sm = cand[3];
  var bw = c * C.cdCW + (c - 1) * C.cdGap, bh = r * C.cdCH + (r - 1) * C.cdGap, wt = C.cdWalkTop, dW, dH, wn, hn;
  if (sm === 3 && pl === 1) {                        // T2: tabs beside the walk
    dW = 2 * C.cdMg + C.cdCW + C.cdWalkGap + C.cdChkW + C.cdRm;
    wn = dW + C.cdTabWalkW;
    dH = wt + C.cdMg + C.cdFootH;
    hn = Math.max(C.cdTitleH + C.cdTabH2 + Math.max(C.cdCH, qwMsCardH(C.cdCW)) + C.cdMg, dH + C.cdWalkMinH);
  } else if (sm === 3) {                             // T1: tabs below the walk
    dW = 2 * C.cdMg + C.cdChkW + C.cdRm;
    wn = Math.max(dW + C.cdTabWalkW, 2 * C.cdMg + C.cdCW);
    hn = wt + C.cdWalkMinH + C.cdWalkGap + C.cdTabH + Math.max(C.cdCH, qwMsCardH(wn - 2 * C.cdMg)) + 0.15 + C.cdFootH + C.cdMg;
  } else if (pl === 0) {                             // B, C: block below, measurement row under it
    dW = 2 * C.cdMg + C.cdChkW + C.cdRm;
    wn = Math.max(dW + C.cdWalkMinW, 2 * C.cdMg + bw);
    hn = wt + C.cdWalkMinH + C.cdWalkGap + C.cdHasMs * (qwMsCardH(bw) + C.cdGap) + bh + 0.15 + C.cdFootH + C.cdMg;
  } else {                                           // A: block beside, measurement card below the block
    dW = 2 * C.cdMg + bw + C.cdWalkGap + C.cdChkW + C.cdRm;
    wn = dW + C.cdWalkMinW;
    dH = wt + C.cdMg + C.cdFootH;
    hn = Math.max(C.cdTitleH + bh + C.cdGap + C.cdMsBelowH + C.cdMg, dH + C.cdWalkMinH);
  }
  return [wn, hn];
}
// kd of arrangement index k (1-based as in layCands): pixels per unit in a window of w x h pixels (layKd)
function qwKdOf(k, w, h) {
  var d = qwDims(QW_CANDS[k - 1]);
  return Math.min(QWC.cdKdMax, Math.min(w / d[0], h / d[1]));
}
// pixels per world unit for a window of w x h pixels (layPick, second result).
// Decision chain (A, B, C, T1, T2 = indices 1..5; an arrangement "fits" if its kd >= cdTabKd):
//   1. landscape = (width >= height)
//   2. narrower than cdTabMaxPx: tabs (landscape: T2 beside, portrait: T1 below)
//   3. landscape: A if it fits, else T2
//   4. portrait: B if it fits, else C if it fits, else T1
// Tabs are the fallback and are used even when they stay small (kd is never below cdMinKd).
function qwPick(w, h) {
  var C = QWC, land = w >= h, sel = land ? 5 : 4;
  if (w >= C.cdTabMaxPx) {
    if (land) { if (qwKdOf(1, w, h) >= C.cdTabKd) sel = 1; }
    else if (qwKdOf(2, w, h) >= C.cdTabKd) sel = 2;
    else if (qwKdOf(3, w, h) >= C.cdTabKd) sel = 3;
  }
  return [sel, Math.max(C.cdMinKd, qwKdOf(sel, w, h))];
}
function qwKd(w, h) { return qwPick(w, h)[1]; }
// inner size of the page without scrollbars / browser toolbars (innerWidth / 100vh can be larger in Safari)
function qwPageSize() {
  var de = document.documentElement;
  return [Math.max(200, de.clientWidth || window.innerWidth), Math.max(200, de.clientHeight || window.innerHeight)];
}
function qwUpdateVR() {
  var s = qwPageSize(), kd = qwKd(s[0], s[1]);
  qwVR[0] = 0; qwVR[1] = 0; qwVR[2] = s[0] / kd; qwVR[3] = -s[1] / kd;
}
qwUpdateVR();
// registered before CindyJS' own (deferred) resize handler, so the rectangle is up to date when it reads it
window.addEventListener("resize", qwUpdateVR);

// A click on a chip changes state in the csmouseup script, but CindyJS does not
// redraw on a plain click (only on the next mouse move). Force one repaint after
// every mouse/touch release so presets and toggles take effect immediately.
// A second repaint ~250 ms later ends the 0.2 s pressed state of the chip without mouse movement.
function qwRepaintSoon() {
  setTimeout(function () { if (cdy) cdy.evokeCS("repaint();"); }, 0);
  setTimeout(function () { if (cdy) cdy.evokeCS("repaint();"); }, 250);
}
["mouseup", "pointerup", "touchend"].forEach(function (ev) {
  window.addEventListener(ev, qwRepaintSoon, true);
});

// ---- link panel: shows the page address + query string from CindyScript (linkOpen) ----
var qwPanel = null, qwInput = null, qwDark = 0;
// theme switch (called by CindyScript themeApply on a change): page background (no light border), link panel style
function qwTheme(d) {
  qwDark = d ? 1 : 0;
  document.documentElement.style.background = document.body.style.background = qwDark ? "#121417" : "#fff";
  document.documentElement.style.colorScheme = qwDark ? "dark" : "light";
  if (qwPanel) qwPanel.className = qwDark ? "qwdark" : "";
}
// system preference -> CindyScript (sysDark); the user's explicit choice (themeUser) takes precedence there
var qwMQ = window.matchMedia ? window.matchMedia("(prefers-color-scheme: dark)") : null;
function qwSysTheme() {
  if (cdy && qwCsReady) cdy.evokeCS("sysDark = " + (qwMQ && qwMQ.matches ? 1 : 0) + ";repaint();");
}
// touch device (coarse primary pointer) -> CindyScript (touchSet): bigger hit areas / chips / handles
var qwTQ = window.matchMedia ? window.matchMedia("(pointer: coarse)") : null;
function qwTouch() {
  if (cdy && qwCsReady) cdy.evokeCS("touchSet(" + (qwTQ && qwTQ.matches ? 1 : 0) + ");repaint();");
}
if (qwTQ) { if (qwTQ.addEventListener) qwTQ.addEventListener("change", qwTouch); else if (qwTQ.addListener) qwTQ.addListener(qwTouch); }
if (qwMQ) { if (qwMQ.addEventListener) qwMQ.addEventListener("change", qwSysTheme); else if (qwMQ.addListener) qwMQ.addListener(qwSysTheme); }
function qwShowLink(query, hint) {
  if (!qwPanel) {
    qwPanel = document.createElement("div");
    qwPanel.id = "qwPanel"; qwPanel.className = qwDark ? "qwdark" : "";
    qwPanel.style.cssText = "position:absolute;left:50%;top:70px;transform:translateX(-50%);z-index:100;width:min(92vw,680px);box-sizing:border-box;" +
      "background:#fff;border:1.5px solid #2682c5;border-radius:8px;box-shadow:0 4px 18px rgba(0,0,0,.3);padding:12px 14px;font:13px sans-serif;color:#333;display:none";
    var x = document.createElement("button");
    x.textContent = "×"; x.title = "Close";
    x.style.cssText = "position:absolute;right:6px;top:2px;border:0;background:none;font-size:24px;line-height:1;cursor:pointer;color:#555";
    x.onclick = qwHideLink;
    qwInput = document.createElement("input");
    qwInput.type = "text"; qwInput.readOnly = true;
    qwInput.style.cssText = "width:100%;box-sizing:border-box;font:13px monospace;padding:6px;border:1px solid #999;border-radius:4px;margin-top:4px";
    qwInput.onfocus = function () { qwInput.select(); };
    var h = document.createElement("div");
    h.id = "qwHint"; h.style.cssText = "margin-top:6px;color:#666";
    qwPanel.appendChild(x); qwPanel.appendChild(qwInput); qwPanel.appendChild(h);
    document.body.appendChild(qwPanel);
    window.addEventListener("keydown", function (e) { if (e.key === "Escape" && qwPanel.style.display !== "none") qwHideLink(); }, true);
  }
  document.getElementById("qwHint").textContent = hint;
  qwInput.value = location.href.split(/[?#]/)[0] + (query ? "?" + query : "");
  qwPanel.style.display = "block";
  qwInput.focus(); qwInput.select();
  setTimeout(function () { qwInput.focus(); qwInput.select(); }, 60);
}
function qwHideLink() { if (qwPanel) qwPanel.style.display = "none"; }

function qwStart() {
  if (cdy) return;
  cdy = CindyJS({
    scripts: "cs*",
    defaultAppearance: {
      dimDependent: 0.7,
      fontFamily: "sans-serif",
      lineSize: 1,
      pointSize: 5.0,
      textsize: 12.0
    },
    angleUnit: "°",
    geometry: [
      {name: "slCoinpP", type: "Free", pos: [4.0, -2.999999999999999, 2.4999999999999996], dimDependent: 1, color: [0.098, 0.408, 0.596]},
      {name: "slCoinPhiP", type: "Free", pos: [-0.24999999999999967, -4.0, 1.2499999999999998], dimDependent: 1, color: [0.098, 0.408, 0.596]},
      {name: "slMaxStepP", type: "Free", pos: [0.07606557377049188, -4.0, 0.3278688524590164], dimDependent: 1, color: [0.545, 0.153, 0.153]},
      {name: "slSpP", type: "Free", pos: [-20.0, 20.0, 1.0], dimDependent: 1, color: [0.27, 0.29, 0.31]},
      {name: "slQP", type: "Free", pos: [-20.0, 20.0, 1.0], dimDependent: 1, color: [0.196, 0.588, 0.333]},
      {name: "upP", type: "Free", pos: [0.98594306888314, -4.0, 0.4273504273504274], dimDependent: 1, color: [0.914, 0.2, 0.224], border: false},
      {name: "downP", type: "Free", pos: [0.7396370021168036, -4.0, 0.4622731263230022], dimDependent: 1, color: [0.094, 0.565, 0.996]},
      {name: "C1", type: "Free", pos: [1.5999999999999999, -4.0, 0.3333333333333333], color: [0.831, 0.639, 1.0], visible: false, size: 3.0},
      {name: "C2", type: "Free", pos: [4.0, 0.0, 0.25], color: [0.831, 0.639, 1.0], visible: false, size: 2.0},
      {name: "SLC", type: "Free", pos: [4.0, -3.000000000000001, 2.5], color: [0.012, 0.655, 0.737], visible: false},
      {name: "IC", type: "Free", pos: [0.6837606837606838, -4.0, 0.4273504273504274], color: [0.51, 0.949, 1.0], visible: false}
    ],
    ports: [{
      fill: "parent",
      id: "CSCanvas",
      transform: [{visibleRect: qwVR}],
      background: "rgb(255,255,255)"
    }],
    csconsole: false,
    use: ["katex"],
    cinderella: {build: 2091, version: [3, 0, 2091]}
  });
  qwConfigure();
}
// Runs once, as soon as the CindyJS object exists AND csinit has finished (whichever comes last; csinit may run
// asynchronously, after plugins are loaded, and would overwrite anything evoked earlier).
var qwCsReady = false, qwConfigured = false;
function qwReady() { qwCsReady = true; qwConfigure(); }
function qwConfigure() {
  if (!cdy || !qwCsReady || qwConfigured) return;
  qwConfigured = true;
  // start configuration from the URL (quotes / backslashes cannot occur in valid parameters and are dropped)
  var raw = function (s) { return JSON.stringify(String(s).replace(/["\\]/g, "")); };
  cdy.evokeCS("sysDark = " + (qwMQ && qwMQ.matches ? 1 : 0) + ";");
  cdy.evokeCS("touchSet(" + (qwTQ && qwTQ.matches ? 1 : 0) + ");");
  cdy.evokeCS("cfgFromUrl(" + raw(location.search) + "," + raw(location.hash) + ");repaint();");
}

// Start only when the page has a real size: in a hidden tab / pane / display:none container the canvas is 0 x 0 and
// CindyJS would compute NaN handle positions (they never recover). Wait for the first resize / visibility change instead.
function qwSized() { var de = document.documentElement; return de.clientWidth > 40 && de.clientHeight > 40; }
function qwTryStart() { if (!cdy && qwSized()) qwStart(); }
qwTryStart();
if (!cdy) {
  window.addEventListener("resize", qwTryStart);
  document.addEventListener("visibilitychange", qwTryStart);
  var qwPoll = setInterval(function () { qwTryStart(); if (cdy) clearInterval(qwPoll); }, 250);
}
</script>

  <div id="CSCanvas"></div>
