// =====================================================================
// Contents of csinit (CindyScript definitions; csdraw is the main loop):
//   1 language & texts          6 drawing (board, histograms, mini histograms)
//   2 colours                   7 UI (chips, cards, sliders, start-state circle, panel)
//   3 layout constants          8 layout computation
//   4 model (coin, step, animation timing)  9 URL parameters & link
//   5 measurement (single run, exact ensemble, collecting)
// Convention: temporaries of functions are declared with regional(...), because
// CindyScript variables are dynamically scoped (a callee would otherwise overwrite
// the caller's variables). Plain globals are meant to be shared state.
// =====================================================================

  ["animNoMs",          "Messung im Animationsmodus nicht verfügbar", "measurement not available in animation mode"],
  ["tabCoin",           "Parameter",                               "Parameters"],

  ["linkHint",          "mit Strg+C bzw. ⌘+C kopieren",           "copy with Ctrl+C or ⌘+C"]

// text for a key in the current language (the key itself if unknown)
tr(key) := (
  regional(idx, result, entry);
  idx = if(lang == "de", 2, 3);
  result = key;
  forall(translations, entry,
    if(entry_1 == key, result = entry_idx)
  );
  result
);


// =====================================================================
// 2  COLOURS
// =====================================================================
// ---- Colour palette (corporate design) - keep complete, including unused colours ----
cAlhambraDark = 1/256 * (98, 103, 72);
cAlhambraLight = 1/256 * (202, 213, 183);
cSFBOrange = 1/256 * (242, 196, 111);
cSFBOrangeText = 1/256 * (220, 150, 20);
cSFBBlue = 1/256 * (39, 130, 197);
cDarkBlue = 1/256 * (22, 42, 103);
cLightBlue = 1/256 * (30, 167, 203);
cMiddleBlue = 1/256 * (26, 105, 153);

cLightGray = (.8, .8, .8);
cDarkGray = (.3, .3, .3);

cAlhambraMid = 1/256 * (150, 160, 120);
cOliveGreen = 1/256 * (110, 120, 90);
cMintGreen = 1/256 * (180, 220, 190);

cAnthracite = 1/256 * (50, 50, 50);
cGraphite = 1/256 * (70, 75, 80);
cLightStoneGray = 1/256 * (190, 190, 185);

cTerracotta = 1/256 * (190, 110, 90);
cDeepRed = 1/256 * (140, 40, 40);
cRosewood = 1/256 * (120, 70, 65);

cBrightRed  = 1/256 * (234,  52,  58);
cBrightBlue = 1/256 * ( 25, 145, 255);

cGreen = 1/256 * (50, 150, 85);

// ---- Colour roles ----
// blue = coin (cards 1+2, also the |→⟩ component), red = |←⟩ component,
// orange = quantum probability, violet = measurement, green = classical, graphite = neutral controls
colDist = cSFBOrange;
colUp = cBrightRed;
colDown = cBrightBlue;
colSlP = cMiddleBlue;
colSlPhi = cMiddleBlue;
colSlN = cGraphite;
colTeXCoin = cMiddleBlue;
colGauss = cGreen;
colCoinCard = cMiddleBlue;
colNeutral = cGraphite;
colMs = 1/256 * (125, 75, 185);        // violet: measurement
colMsDark = 1/256 * (75, 30, 135);

// ---- Theme (light / dark) ----
// The colour roles above (colUp, colDown, colDist, colMs, ...) and the neutral tokens th* are (re)assigned by
// setTheme(dark): light = exactly the palette above; dark = palette colours mixed towards white (contrast on thBg).
// Mode = user choice (themeUser: -1 none, 0 light, 1 dark; chip / ?theme=) else the system preference (sysDark, set by JS).
sysDark = 0;  themeUser = -1;  themeCur = 0;
// Touch device (coarse pointer, set by JS via touchSet): hit areas of chips >= cdTouchMin px, taller chips in tab mode, bigger handles.
touchOn = false;
mixW(c, t) := (1 - t)*c + t*(1, 1, 1);
setTheme(dark) := (
  themeCur = dark;
  // light (as before)
  thBg = (1, 1, 1);  thPaper = (1, 1, 1);  thOnCol = (1, 1, 1);          // page, "white" fills/halos, text on solid chips
  thFg = cAnthracite;  thMuted = cGraphite;                                  // main text / axes, secondary text
  thCircLine = cDarkGray;  thBlue = cSFBBlue;  thOrange = cSFBOrangeText;   // circle outlines, blue UI text, orange text
  thCardA = .05;  thBandA = .13;                                             // card tint alpha, measurement band alpha
  colUp = cBrightRed;  colDown = cBrightBlue;  colDist = cSFBOrange;
  colMs = 1/256 * (125, 75, 185);  colMsDark = 1/256 * (75, 30, 135);  colGauss = cGreen;
  colSlP = cMiddleBlue;  colSlPhi = cMiddleBlue;  colTeXCoin = cMiddleBlue;  colCoinCard = cMiddleBlue;
  colSlN = cGraphite;  colNeutral = cGraphite;
  if(dark == 1, (
    thBg = 1/256 * (18, 20, 23);  thPaper = thBg;  thOnCol = thBg;
    thFg = (.92, .93, .94);  thMuted = (.68, .70, .73);
    thCircLine = (.8, .8, .8);  thBlue = mixW(cSFBBlue, .4);  thOrange = mixW(cSFBOrangeText, .1);
    thCardA = .12;  thBandA = .22;
    colUp = mixW(cBrightRed, .22);  colDown = mixW(cBrightBlue, .25);  colDist = cSFBOrange;
    colMs = mixW(1/256 * (125, 75, 185), .45);  colMsDark = mixW(1/256 * (125, 75, 185), .75);  colGauss = mixW(cGreen, .4);
    colSlP = mixW(cMiddleBlue, .45);  colSlPhi = colSlP;  colTeXCoin = colSlP;  colCoinCard = colSlP;
    colSlN = thMuted;  colNeutral = thMuted;
  ));
);
setTheme(0);
// apply the effective mode (called every frame; JS only on a change: page background, link panel style)
themeApply() := (
  regional(d);
  d = if(themeUser >= 0, themeUser, sysDark);
  if(d != themeCur, (setTheme(d); javascript("qwTheme(" + d + ")")));
);
// browser tab title follows the language (JS only on a change)
titleLang = "";
titleApply() := (
  if(lang != titleLang, (titleLang = lang; javascript("document.title='" + tr("title") + "'")));
);


// =====================================================================
// 3  LAYOUT CONSTANTS
// The port fills the browser window. All sizes are in world units; one unit is
// "kd" pixels, where kd is chosen by layPick() (section 8) so that the cards fit.
// Text sizes: fs(n) = n * layKs, layKs = pixels-per-unit / layKRef.
//
// ARRANGEMENT (chosen by layPick, a short decision chain, see there): the 4 base cards (1 coin sliders,
// 2 coin matrix + presets, 3 start state, 4 walk settings) and card 5 (measurement, always reserved) are arranged as
//   A: 2x2 beside the walk (left), measurement card below them in the same column   [2,2,1,2]
//   B: 4 cards in a row below the walk, measurement card as a full-width row under them   [4,1,0,0]
//   C: 2x2 below the walk, measurement card as a row under them   [2,2,0,0]
//   T1: tabs below the walk (one card at a time)   T2: tabs beside the walk   [1,1,0,3] / [1,1,1,3]
// =====================================================================
cdCW = 4.7;             // card width (minimum width in flow layouts)
cdCH = 4.8;             // card height
cdAnimMaxN = 10;        // largest N in animation mode (all transitions are animated at once; larger N gets too small to read)
cdGap = 0.25;           // gap between cards
cdPad = 0.3;            // inner padding of a card
cdMg = 0.4;             // outer margin of the window
cdTitleH = 1.3;         // height of the title band above the cards
cdWalkTop = 2.0;        // top of the walk area below the top edge (leaves room for the histogram legend)
cdWalkGap = 0.3;        // gap between cards and walk
cdWalkMinW = 8.0;       // minimum walk width
cdWalkMinH = 6.0;       // minimum walk height
cdChkW = 1.5;           // room left of the walk for the measurement boxes / probability axis labels (always reserved)
cdChkW1 = 0.9;          // width of the single checkbox column (one kind on)
cdRm = 0.6;             // right margin next to the walk (walk below the cards)
cdHasMs = 1;            // 1: measurement card exists (always reserved)
cdFootH = 1.0;          // footer band height (upper bound)
cdWalkMaxAsp = 3.2;     // > 0: walk width at most this multiple of its height (0 = no limit); also used to rate the walk area
cdCardMaxW = 5.4;       // flow cards stretch to fill the width, up to this width
cdMinKd = 28;           // lowest allowed pixels per unit (hard limit)
cdKdMax = 90;           // highest pixels per unit
cdMsH = 3.9;            // measurement card, full-width row under a wide block: 3 columns
cdMs1H = 7.6;           // measurement card with one column (sections stacked), height (tab layout, narrow card)
cdMs3W = 12.5;          // measurement card at least this wide: 3 columns; below: 2 columns
cdMs2W = 9.0;           // measurement card at least this wide: 2 columns; below: 1 column
cdMsBelowH = 5.4;       // 2x2 beside: measurement card below the 2x2 block (same width), minimal height
cdMsBelowMaxH = 8.0;    // 2x2 beside: maximal height of that card (spare height centres the left column vertically)
cdChipH  = 0.52;        // height of a chip
cdTabH = 1.0;           // tab layout (phones): height of the tab bar incl. gap to the card
cdTabKd = 44;           // an arrangement with cards is used only if it reaches at least this scale (px per unit); else tabs
cdTabH2 = 1.6;          // tab layout beside the walk: height of the two-row tab bar incl. gap to the card
cdTabMaxPx = 600;       // tabs whenever the window is narrower than this many CSS pixels (more room for the walk)
cdTabWalkW = 5.0;       // tab layout: minimum walk width (replaces cdWalkMinW)
cdTouchPx = 28;         // minimal click target height in pixels (hit areas are padded to this)
cdTouchMin = 44;        // touch devices: minimal click target width and height in CSS pixels
cdTouchChipPx = 40;     // touch devices, tab layout: chips grow towards this height in pixels (as far as the card has room)
cdTouchPt = 1.8;        // touch devices: handle (point) size factor
layKRef  = 62;          // pixels per world unit the font sizes were designed for
layL     = 3.6;         // slider rail length

// arrangements [columns, rows, place (0 below / 1 beside), measurement card (2 below the block / 0 row under it / 3 tabs)]
// index: 1 = A, 2 = B, 3 = C, 4 = T1 (tabs below), 5 = T2 (tabs beside)
layCands = [[2,2,1,2], [4,1,0,0], [2,2,0,0], [1,1,0,3], [1,1,1,3]];

// font size hierarchy (px at layKRef px/unit): title 30 > card title 15 > label 12 > text 11 > ticks 10
fsT = 30; fsCard = 15; fsLab = 12; fsTxt = 11; fsTick = 10;

// layout results (written by computeLayout, read by drawing and UI code)
layKs    = 1;                                                   // font scale
layCard  = [[0,0,4.7,4.8],[0,0,4.7,4.8],[0,0,4.7,4.8],[0,0,4.7,4.8],[0,0,4.7,4.8]];   // [x left, y top, width, height] per card
layCardP = [];                                                  // previous card rectangles (to detect changes)
layOk = true;                                                   // false while the canvas has no usable size
layWalkBL = [1, -13];  layWalkTR = [10, -2];                    // walk rectangle
layFootX = 10;  layFootY = -14;  layFootLines = 2;              // footer anchor and number of text lines
layPY = -3;  layPhY = -4;  layICx = 2;  layICy = -4;  layNy = -2;  layQy = -3;   // handle anchors
layXlp = 0; layXrp = -1; layYtp = 0; layYbp = -1;               // previous visible bounds
layChanged = true;                                              // layout changed: re-place the handles
layTabs  = false;                                               // true: tab layout (one card at a time)
layTab   = 1;  layTabP = 1;                                     // tab layout: shown card 1..5 (5 = measurement / animation)
layTabR  = [0, 0, 1, 1];                                        // tab bar rectangle [x left, y bottom, width, height]
layTabRows = 1;                                                 // tab bar rows (1 below the walk, 2 beside it: 3 + 2 chips)
cardShown(k) := (!layTabs) % (layTab == k);

fs(n) := n*layKs;       // font size scaled to the current resolution


// =====================================================================
// 4  MODEL: quantum coin and walk step
// A site holds the two-component amplitude [up, down] = [|←⟩ part (moves left), |→⟩ part (moves right)].
// One step = coin U on every site, then conditional shift: up -> site j-1, down -> site j+1.
// =====================================================================
maxmaxSteps = 100;       // upper limit of the N slider (arrays are sized for it)
maxSteps = maxmaxSteps;  // current number of steps N (set by the slider)
mid = maxSteps + 1;      // index of site 0 in the global lists (2*maxmaxSteps + 1 sites)

particle = [1/sqrt(2), i/sqrt(2)];     // start state [up, down] (set by the start-state circle)
coinP = .5;                            // coin bias p (set by its slider)
coinRot = 0;                           // coin phase phi (set by its slider)

distNormalizeToMax = true;   // true: tallest bar reaches the full height; false: physically linear heights

up(state) := state_1;
down(state) := state_2;
setUp(state, newUp) := [newUp, down(state)];
setDown(state, newDown) := [up(state), newDown];

cis(phi) := cos(phi) + i*sin(phi);       // e^{i phi}

// coin matrix U(p, phi): unitary, real for phi = 0, pi
coinGen(p, phi) := [
  [ sqrt(p),              cis(phi)*sqrt(1-p) ],
  [ cis(-phi)*sqrt(1-p), -sqrt(p)            ]
];

coin = coinGen(coinP, coinRot);

// walk state: one [up, down] pair per site; the particle starts at site 0
initState = apply(1..(2*maxSteps + 1), [0+0*i, 0+0*i]);
initState_mid = particle;

// one step on a list of sites: coin on every site, then shift (up to the left neighbour, down to the right one)
walkstep(state) := (
  regional(afterCoin, n, nextstate, j, toLeft, toRight);
  afterCoin = apply(state, coin*#);
  n = length(state);
  nextstate = apply(1..n, [0+0*i, 0+0*i]);
  forall(1..n, j, (
    toLeft = up(afterCoin_j);
    toRight = down(afterCoin_j);
    if(j > 1, nextstate_(j-1) = setUp(nextstate_(j-1), up(nextstate_(j-1)) + toLeft));
    if(j < n, nextstate_(j+1) = setDown(nextstate_(j+1), down(nextstate_(j+1)) + toRight));
  ));
  nextstate
);

// site probabilities |up|^2 + |down|^2
probsOf(state) := apply(1..length(state), j, abs(state_j_1)^2 + abs(state_j_2)^2);

maxOf(L) := (
  regional(n, m, k);
  n = length(L);
  if(n == 0, 0,
    (m = L_1; forall(2..n, k, if(L_k > m, m = L_k)); m)
  )
);

// binomial coefficient without overflow
comb(n, k) := (
  regional(kq, pq, iq);
  if(k < 0 % k > n, 0,
    (kq = min(k, n-k);
     pq = 1;
     if(kq > 0, forall(1..kq, iq, pq = pq * (n - kq + iq) / iq));
     pq)
  )
);

// a^e with 0^0 = 1
galtonPow(a, e) := if(e == 0, 1, a^e);


// ---- animation mode: all step transitions (rows 0..N-1 -> 1..N) move at once; row N appears only through them ----
// Phases of one transition at progress t in [0,1] (see stateTransition):
//   0..t1 scale/rotate the two arrows by the coin entries; t1..t2 parallelogram; t2..t3 the sum grows, the others fade; 0..1 shift
animT1 = 1/3;  animT2 = 2/3;  animT3 = 5/6;
animOn = false;      // animation mode (chip in the Walk card)
animrun = true;      // false: paused by the chip
animLength = 1;      // seconds per step, set by the speed slider (stSp)
waittime = 0.3;      // hold time at both ends of a transition
animT = 0;           // current progress of the transition
animTime = 0;        // animation clock; stands still while paused
animPrev = 0;        // seconds() of the previous frame
animNSaved = 0;      // N before entering animation mode if it had to be clamped (0 = nothing to restore)
loopOn = false;      // state of the CindyJS animation loop (see loopSync)

// progress t in [0,1]: hold at 0 for waittime, ramp over animLength seconds, hold at 1, repeat
updateT() := (
  regional(al, wt, period, ph);
  al = max(1e-6, animLength);
  wt = max(0, waittime);
  period = al + 2*wt;
  ph = mod(animTime, period);
  if(ph < wt, 0, if(ph < wt + al, (ph - wt)/al, 1))
);
animTick() := (
  regional(now, k);
  now = seconds();
  animLength = 12*(0.8/12)^stSp;                   // exponential speed range: 12 s (slow) ... 0.8 s (fast) per step
  waittime = 0.15*animLength;                      // hold time scales with the speed
  if(animOn & animrun, animTime = animTime + min(0.1, now - animPrev));
  animPrev = now;
  animT = updateT();
);
// ONE decision whether the CindyJS loop (playanimation) runs: animation, queued runs, exact-mean computation.
// pauseanimation(), not stopanimation(): stop would restore the saved geometry (sliders jump back).
// Called at the end of every frame and after state changes; the others only set the state flags.
loopWanted() := (animOn & animrun & maxSteps > 0) % msPending > 0 % msEnsBusy;
loopSync() := (
  regional(w);
  w = loopWanted();
  if(w != loopOn, (loopOn = w; if(w, playanimation(), pauseanimation())));
);
// N limit of the current mode and clamping when entering / leaving animation mode
nLimit() := if(animOn, cdAnimMaxN, maxmaxSteps);
animSetMode(on) := (
  if(on & !animOn, (
    animOn = true;  animrun = true;  animTime = 0;
    if(stN > cdAnimMaxN, (animNSaved = stN; stN = cdAnimMaxN; maxSteps = stN));
  ));
  if(!on & animOn, (
    animOn = false;
    if(animNSaved > 0 & stN == cdAnimMaxN, (stN = animNSaved; maxSteps = stN));    // restore unless N was changed meanwhile
    animNSaved = 0;
  ));
  msSync();
  layRemap();
);


// =====================================================================
// 5  MEASUREMENT (position and/or coin measurements in selectable rows)
// msRows_k = 1: the position is measured after step k (row k of the board).
// msCoin_(k+1) = 1: the coin (qubit) is measured in row k (row 0: before step 1).
// Measuring = projecting the state onto the outcome and renormalising (Lueders rule); for the
// ensemble average over many runs this is dephasing: the measured degrees of freedom lose their
// off-diagonal density-matrix entries.
// msU / msU2: fixed uniform random numbers of the displayed single run (inverse CDF), new ones
// only by "re-roll". msCnt: collected final positions (global site index).
// =====================================================================
msOn = false;       // any measurement kind on
msPosOn = false;    // position measurement toggle
msCoinOn = false;   // coin measurement toggle
msExOn = false;     // show the exact ensemble mean (violet); the density-matrix computation runs only while on
msMiniOn = false;   // per-row mini histograms right of the board
msRowsU = apply(1..maxmaxSteps, k, 0);              // stored user flags (kept while a kind is switched off)
msCoinU = apply(1..(maxmaxSteps + 1), k, 0);
msRows = apply(1..maxmaxSteps, k, 0);               // EFFECTIVE flags used by all computations (= U if the kind is on, else 0)
msCoin = apply(1..(maxmaxSteps + 1), k, 0);         // effective coin flags
msU = apply(1..maxmaxSteps, k, random());           // random numbers for the position outcomes of the single run
msU2 = apply(1..(maxmaxSteps + 1), k, random());    // random numbers for the coin outcomes of the single run
msZ = apply(1..(2*maxmaxSteps + 3), k, 0);          // zeros, for cheap slicing
msCnt = apply(1..(2*maxmaxSteps + 1), k, 0);        // collected runs: count per global site
msN = 0;            // number of collected runs
msPending = 0;      // runs still queued
msKeyPrev = 1;      // physics parameters of the collected data (see msUpdate)
msPre = [];         // per row k (0..N): site probabilities of the single run BEFORE the measurements of that row
msCoinOut = [];      // coin outcome per row 0..N of the single run (1 = |<-, 2 = |->, 0 = not measured)
msOut = [];         // outcome site (global index) per row of the single run, 0 = not measured
msFq = [];          // relative frequencies for the visible slice (set while drawing)

msSync() := (
  msOn = (msPosOn % msCoinOn) & !animOn;
  if(!msOn, (msPending = 0; msEnsBusy = false));
);
// effective flags: a disabled kind is ignored by the single run, the exact ensemble and collecting,
// but its stored flags (msRowsU / msCoinU) survive and come back when it is re-enabled
msEffective() := (
  msRows = apply(1..maxmaxSteps, k, if(msPosOn, msRowsU_k, 0));
  msCoin = apply(1..(maxmaxSteps + 1), k, if(msCoinOn, msCoinU_k, 0));
);

// ---- flag helpers ----
msRowsOn() := if(maxSteps > 0, sum(apply(1..maxSteps, k, msRows_k)), 0);
msCoinAny() := sum(apply(1..(maxSteps + 1), k, msCoin_k)) > 0;
msAnyMeas() := (msRowsOn() > 0) % msCoinAny();
// coin measurement flag of row k (row 0: before step 1); independent of the position measurement
msCoinFlag(k) := msCoin_(k+1) == 1;
// greyed out: position of this row is measured AND the coin is already fixed by it
// (row 1, or the position of row k-1 was measured too) -> the coin projection is trivial
msGreyed(k) := if(k <= 0, false, if(k == 1, msRows_1 == 1, msRows_k == 1 & msRows_(k-1) == 1));
msFixAny() := (
  regional(k, f);
  f = false;
  if(maxSteps > 0, forall(1..maxSteps, k, if(msGreyed(k), f = true)));
  f
);

// ---- sampling ----
// index of the sampled site (inverse CDF) for probabilities P (list) and u in [0,1)
msPick(P, u, lo, hi) := (
  regional(thr, c, j, last, jj);
  thr = u*sum(P_(lo..hi));
  c = 0; j = 0; last = lo;
  forall(lo..hi, jj, (
    c = c + P_jj;
    if(P_jj > 1e-15, (last = jj; if(j == 0 & c > thr, j = jj)));
  ));
  if(j == 0, last, j)
);

// single run: collapse a full state (list of [up,down]) at a sampled site; returns [state, site]
msMeasureState(st, u) := (
  regional(P, n0, j, sq, res);
  n0 = length(st);
  P = probsOf(st);
  j = msPick(P, u, 1, n0);
  sq = sqrt(P_j);
  res = apply(1..n0, jj, if(jj == j, [st_j_1/sq, st_j_2/sq], [0+0*i, 0+0*i]));
  [res, j]
);

// outcome (1 = |←⟩, 2 = |→⟩) of a global coin measurement on amplitude lists a (up) and b (down)
msCoinPickArr(a, b) := (
  regional(PL, PR);
  PL = sum(apply(a, z, abs(z)^2));  PR = sum(apply(b, z, abs(z)^2));
  if(PR < 1e-30, 1, if(PL < 1e-30, 2, if(random()*(PL + PR) < PL, 1, 2)))
);

// global Lueders projection of a full state (list of [up, down]) onto |←⟩ (1) or |→⟩ (2); returns [state, outcome]
msCoinGlobal(st, u) := (
  regional(PL, PR, o);
  PL = sum(apply(st, z, abs(z_1)^2));  PR = sum(apply(st, z, abs(z_2)^2));
  o = if(PR < 1e-30, 1, if(PL < 1e-30, 2, if(u*(PL + PR) < PL, 1, 2)));
  [if(o == 1, apply(st, z, [z_1/sqrt(PL), 0+0*i]), apply(st, z, [0+0*i, z_2/sqrt(PR)])), o]
);

// ---- the displayed single run (called every frame): fills walk (all rows), msOut and msPre ----
computeSingleRun() := (
  regional(st, res, k, j, jc);
  st = initState;
  msPre = [];
  msCoinOut = [0];
  if(msOn & msMiniOn, msPre = [probsOf(st)]);      // row 0: before the coin measurement
  if(msOn & msCoin_1 == 1, (res = msCoinGlobal(st, msU2_1); st = res_1; msCoinOut = [res_2]));
  walk = [st];
  msOut = [];
  repeat(maxSteps, k, (
    st = walkstep(walk_(-1));
    j = 0;  jc = 0;
    if(msOn & msMiniOn, msPre = msPre ++ [probsOf(st)]);   // distribution the row's measurements sample from
    if(msOn,
      (
        if(msRows_k == 1, (res = msMeasureState(st, msU_k); st = res_1; j = res_2));
        // greyed row: the position measurement already fixed the coin; its outcome is the surviving component
        if(msCoinOn & msGreyed(k) & j > 0, jc = if(abs(st_j_1)^2 >= abs(st_j_2)^2, 1, 2));
        // coin measurement (global projection), commutes with the position measurement
        if(msCoin_(k+1) == 1, (res = msCoinGlobal(st, msU2_(k+1)); st = res_1; jc = res_2));
      )
    );
    msCoinOut = msCoinOut ++ [jc];
    walk = walk ++ [st];
    msOut = msOut ++ [j];
  ));
);

// ---- collecting: one complete run on the reachable slice only, fresh random numbers; counts the final site ----
msOneRun() := (
  regional(a, b, a1, b1, c11, c12, c21, c22, m, P, lo, hi, j, sq, aj, bj, s, jj, o);
  c11 = coin_1_1; c12 = coin_1_2; c21 = coin_2_1; c22 = coin_2_2;
  a = [particle_1]; b = [particle_2];
  if(msCoin_1 == 1, (o = msCoinPickArr(a, b); if(o == 1, b_1 = 0, a_1 = 0)));
  lo = 1; hi = 1;
  repeat(maxSteps, s, (
    a1 = c11*a + c12*b;  b1 = c21*a + c22*b;      // coin on all sites at once (vector arithmetic)
    a = a1 ++ [0, 0];    b = [0, 0] ++ b1;        // shift: up stays in place, down moves one slot (list grows by 2)
    hi = hi + 2;
    if(msRows_s == 1, (
      P = apply(lo..hi, jj, abs(a_jj)^2 + abs(b_jj)^2);
      j = lo - 1 + msPick(P, random(), 1, length(P));
      aj = a_j; bj = b_j; sq = sqrt(P_(j - lo + 1));
      m = length(a);
      a = msZ_(1..m); b = msZ_(1..m);
      a_j = aj/sq; b_j = bj/sq;
      lo = j; hi = j;
    ));
    if(msCoin_(s+1) == 1, (
      o = msCoinPickArr(a, b);
      m = length(a);
      if(o == 1, b = msZ_(1..m), a = msZ_(1..m));
    ));
  ));
  P = apply(lo..hi, jj, abs(a_jj)^2 + abs(b_jj)^2);
  j = lo - 1 + msPick(P, random(), 1, length(P));
  j = mid - maxSteps - 1 + j;
  msCnt_j = msCnt_j + 1;
);

// ---------------------------------------------------------------------
// EXACT ENSEMBLE DISTRIBUTION (no sampling): density-matrix propagation.
// rho is stored as four M x M blocks R_cc' (c, c' in {L = |←⟩ (moves j-1), R = |→⟩ (moves j+1)}),
// M = s+1 reachable sites of step s (only sites of the right parity: x = -s + 2m, m = 0..s).
//   coin step : R'_cc' = sum_{d,d'} U_cd R_dd' conj(U_c'd')      (scalar * matrix, native)
//   shift     : L: m -> m, R: m -> m+1 (pad zero rows / columns, matrix grows to (s+2) x (s+2))
//   position measurement (ensemble average): every block -> its diagonal (dephasing in position)
//   coin measurement (ensemble average): R_LR = R_RL = 0 (dephasing in the coin); row 0: before the first step
//   result: P_m = diag(R_LL) + diag(R_RR).
// The loop runs a few steps per frame (time budget) while msEnsBusy; the previous msEns stays visible.
// ---------------------------------------------------------------------
msEns = [];            // exact site probabilities (global list), [] = not available
msEnsStale = true;     // parameters changed: recompute when needed
msEnsBusy = false;     // computation in progress
msEgA = [[1]]; msEgB = [[0]]; msEgC = [[0]]; msEgD = [[0]];   // R_LL, R_LR, R_RL, R_RR
msEgU = [[1,0],[0,1]];  // coin used
msEgS = 0;             // steps done
msEgN = 0;             // target number of steps

msEgStart() := (
  regional(pa, pb);
  pa = particle_1; pb = particle_2;
  msEgN = maxSteps;  msEgU = coin;
  msEgA = [[pa*conjugate(pa)]]; msEgB = [[pa*conjugate(pb)]];     // rho = |psi><psi|
  msEgC = [[pb*conjugate(pa)]]; msEgD = [[pb*conjugate(pb)]];
  if(msCoin_1 == 1, (msEgB = [[0]]; msEgC = [[0]]));
  msEgS = 0;
  msEnsBusy = true;
);

// pad one zero row (front or back) and one zero column (front or back) to an M x M matrix
msEgShift(Mat, rf, cf, M) := (
  regional(zr, X);
  zr = msZ_(1..M);
  X = if(rf, [zr] ++ Mat, Mat ++ [zr]);
  if(cf, apply(X, r, [0] ++ r), apply(X, r, r ++ [0]))
);
// diagonal part of an M x M matrix
msEgDiag(Mat, M) := apply(1..M, ii,
  (if(ii > 1, msZ_(1..(ii-1)), []) ++ [Mat_ii_ii] ++ (if(ii < M, msZ_(1..(M-ii)), []))));

msEgStep() := (
  regional(M, u00, u01, u10, u11, v00, v01, v10, v11, TLL, TRL, TLR, TRR, nA, nB, nC, nD, kk);
  M = msEgS + 1;
  u00 = msEgU_1_1; u01 = msEgU_1_2; u10 = msEgU_2_1; u11 = msEgU_2_2;
  v00 = conjugate(u00); v01 = conjugate(u01); v10 = conjugate(u10); v11 = conjugate(u11);
  // rows: T_cd' = sum_d U_cd R_dd'
  TLL = u00*msEgA + u01*msEgC;  TRL = u10*msEgA + u11*msEgC;
  TLR = u00*msEgB + u01*msEgD;  TRR = u10*msEgB + u11*msEgD;
  // columns: R'_cc' = sum_d' T_cd' conj(U_c'd')
  nA = v00*TLL + v01*TLR;  nB = v10*TLL + v11*TLR;
  nC = v00*TRL + v01*TRR;  nD = v10*TRL + v11*TRR;
  // shift (rows by c, columns by c'): L stays, R moves one slot
  msEgA = msEgShift(nA, false, false, M);  msEgB = msEgShift(nB, false, true, M);
  msEgC = msEgShift(nC, true, false, M);   msEgD = msEgShift(nD, true, true, M);
  msEgS = msEgS + 1;  kk = msEgS;  M = M + 1;
  if(msRows_kk == 1, (
    msEgA = msEgDiag(msEgA, M); msEgB = msEgDiag(msEgB, M);
    msEgC = msEgDiag(msEgC, M); msEgD = msEgDiag(msEgD, M);
  ));
  if(msCoin_(kk+1) == 1, (
    msEgB = apply(1..M, ii, msZ_(1..M));  msEgC = apply(1..M, ii, msZ_(1..M));
  ));
);

msEgFinish() := (
  regional(Pc, n1);
  n1 = msEgN + 1;
  Pc = apply(1..n1, m, re(msEgA_m_m + msEgD_m_m));
  msEns = apply(1..(2*msEgN + 1), k, if(mod(k, 2) == 1, Pc_((k+1)/2), 0));
  msEnsBusy = false;
);

// called every frame from msUpdate
msEgWork() := (
  regional(t0);
  if(msEnsStale & msExOn, (
    msEnsStale = false;
    if(msAnyMeas(), msEgStart(), (msEns = []; msEnsBusy = false));
  ));
  // switched off while computing: drop the unfinished result (recomputed when switched on again)
  if(!msExOn & msEnsBusy, (
    msEnsBusy = false; msEns = []; msEnsStale = true;
  ));
  if(msEnsBusy, (
    t0 = seconds();
    if(msEgS < msEgN, (
      msEgStep();
      while(msEgS < msEgN & seconds() - t0 < 0.025, msEgStep());
    ));
    if(msEgS >= msEgN, msEgFinish());
  ));
);

// ---- collecting and cache invalidation (called every frame) ----
// reset of the collected data when the physics changes; incremental collecting within a time budget
msUpdate() := (
  regional(t0, key);
  if(msOn,
    (
      // values are rounded (1e-9): the slider / knob re-projection jitters in the last bits every frame,
      // which would otherwise look like a parameter change and reset the collected data constantly
      key = [round(coinP*1e9), round(coinRot*1e9), maxSteps,
             round(re(particle_1)*1e9), round(im(particle_1)*1e9), round(re(particle_2)*1e9), round(im(particle_2)*1e9),
             if(maxSteps > 0, apply(1..maxSteps, k, msRows_k), []),
             apply(1..(maxSteps + 1), k, msCoinFlag(k - 1))];
      if(key != msKeyPrev, (
        msKeyPrev = key;
        msCnt = apply(1..(2*maxmaxSteps + 1), k, 0);
        msN = 0;
        msEnsStale = true;
        if(!msExOn, msEns = []);        // cached mean no longer valid
        msPending = 0;
      ));
      msEgWork();
      if(msPending > 0, (
        t0 = seconds();
        msOneRun(); msN = msN + 1; msPending = msPending - 1;
        while(msPending > 0 & seconds() - t0 < 0.03, (
          msOneRun(); msN = msN + 1; msPending = msPending - 1;
        ));
      ));
    ),
    (msKeyPrev = 1; msEns = []; msEnsStale = true; msEnsBusy = false)
  );
);

// queue n more runs; the animation loop (draw every frame) works them off
msQueue(n) := (
  msPending = min(5000, msPending + n);
);


// =====================================================================
// 6  DRAWING: board of sites, histograms, mini histograms
// =====================================================================

// ---- one site: circle with two arrows (length = |amplitude|, direction = phase, red = up, blue = down) ----
ampAlpha(L) := L^0.6;     // weak amplitudes are drawn fainter

drawArrow(c, len, phi, col, a, sz) := draw(c, c + len*[cos(phi), sin(phi)], color->col, alpha->a, size->sz);

// arrow of one amplitude z (nothing for vanishing amplitudes)
drawAmplitude(center, r, z, col) := (
  regional(L);
  L = abs(z);
  // CindyScript: arctan2(x, y) = angle of the point (x, y)
  if(L > 1e-6, drawArrow(center, r*L, arctan2(re(z), im(z)), col, ampAlpha(L), 3.0));
);

drawSiteCircle(center, r) := (
  fillcircle(center, r, color->cLightGray, alpha->.1);
  drawcircle(center, r, color->thCircLine, alpha->.5);
);

drawSite(center, r, s) := (
  drawSiteCircle(center, r);
  drawAmplitude(center, r, s_1, colUp);
  drawAmplitude(center, r, s_2, colDown);
);

// ---- animation of one step (animation mode) ----
// linear map of x from [a,b] to [c,d], clamped at the ends
mapValueF(x, a, b, c, d) := c + (d - c)*min(1, max(0, (x - a)/(b - a)));
vec(z) := [re(z), im(z)];      // complex number -> plane vector

// Transition of a site (state = [a, b]) to a neighbouring site at progress t. The new amplitude is
// sU*e^{i aU}*a + sD*e^{i aD}*b (one row of the coin matrix); phases: see section 4. The circle moves from startC to endC;
// the coloured outline (sumCol) fades in while the left- and right-moving circles separate and fades out near the target.
stateTransition(startC, endC, radius, state, t, sU, aU, sD, aD, sumCol) := (
  regional(c, u, d, fade, grow, outlineAlpha, tSep);
  c = startC + t*(endC - startC);
  tSep = min(0.6, radius/max(1e-6, |endC - startC|));
  u = mapValueF(t, 0, animT1, 1, sU)*cis(mapValueF(t, 0, animT1, 0, aU))*state_1;
  d = mapValueF(t, 0, animT1, 1, sD)*cis(mapValueF(t, 0, animT1, 0, aD))*state_2;
  fade = mapValueF(t, animT2, 1, 1, 0);
  grow = mapValueF(t, animT1, animT2, 0, 1);
  outlineAlpha = mapValueF(t, 0.5*tSep, tSep, 0, 1)*mapValueF(t, 0.75, 1, 1, 0);
  drawSiteCircle(c, radius);
  drawcircle(c, radius, color->sumCol, size->2.5, alpha->outlineAlpha);
  draw(c, c + radius*vec(u), color->colUp,   size->3, alpha->fade);
  draw(c, c + radius*vec(d), color->colDown, size->3, alpha->fade);
  if(t > animT1,
    draw(c + radius*vec(u), c + radius*vec(u) + radius*grow*vec(d), color->colDown, size->3, alpha->fade);
    draw(c + radius*vec(d), c + radius*vec(d) + radius*grow*vec(u), color->colUp,   size->3, alpha->fade);
  );
  if(t > animT2,
    draw(c, c + mapValueF(t, animT2, animT3, 0, 1)*radius*(vec(d) + vec(u)), color->sumCol, size->3);
  );
);
// to the left neighbour: first row of U = (sqrt(p), e^{i phi} sqrt(1-p))
stateTransitionUp(startC, endC, radius, coinbias, coinphase, state, t) :=
  stateTransition(startC, endC, radius, state, t, sqrt(coinbias), 0, sqrt(1-coinbias), coinphase, colUp);
// to the right neighbour: second row of U = (e^{-i phi} sqrt(1-p), -sqrt(p))
stateTransitionDown(startC, endC, radius, coinbias, coinphase, state, t) :=
  stateTransition(startC, endC, radius, state, t, sqrt(1-coinbias), -coinphase, -sqrt(coinbias), 0, colDown);

// reachable after stepCount steps?  |colIndex-mid| <= stepCount  and  (|colIndex-mid| + stepCount) even
isReachable(colIndex, stepCount) := (
  regional(distFromMid);
  distFromMid = abs(colIndex - mid);
  (distFromMid <= stepCount) & (mod(distFromMid,2) == mod(stepCount,2))
);

// ---- measurement decorations of the board ----
// both measurement kinds on: two box columns side by side, otherwise one column
msBothOn() := msPosOn & msCoinOn;
msBoxW() := if(msBothOn(), cdChkW, cdChkW1);        // width of the box column area

// violet band behind a measured board row
msRowDecor(xl, xr, y, dy) := (
  fillpoly([[xl, y - dy/2], [xr, y - dy/2], [xr, y + dy/2], [xl, y + dy/2]], color->colMs, alpha->thBandA);
);

// dashed frame around a row band whose qubit measurement gave o (1 = |<-, 2 = |->): red / blue
msRowFrame(xl, xr, y, dy, o) := (
  regional(c, a, b, n, k, t0, t1, yy, h);
  c = if(o == 1, colUp, colDown);
  h = dy/2*0.94;
  n = 2*floor(abs(xr - xl)/0.3);
  forall(0..(n - 1), k, if(mod(k, 2) == 0, (
    t0 = xl + (xr - xl)*k/n;  t1 = xl + (xr - xl)*(k + 1)/n;
    draw([t0, y + h], [t1, y + h], color->c, size->1.3);
    draw([t0, y - h], [t1, y - h], color->c, size->1.3);
  )));
  n = max(2, 2*floor(2*h/0.15));
  forall(0..(n - 1), k, if(mod(k, 2) == 0, (
    t0 = y - h + 2*h*k/n;  t1 = y - h + 2*h*(k + 1)/n;
    draw([xl, t0], [xl, t1], color->c, size->1.3);
    draw([xr, t0], [xr, t1], color->c, size->1.3);
  )));
);

// checkbox of one board row (centre cx, row pitch dy); shrinks with the rows, >= 2.5 px.
// kind 0: position box, 1: coin box, 2: coin box already fixed (greyed out, auto-checked)
msChkDraw(cx, y, dy, on, kind) := (
  regional(kp, px, hs, xl, xr, yb, yt, cg);
  kp = screenresolution();
  px = max(2.5, min(fs(11), 0.72*dy*kp));
  hs = 0.5*px/kp;
  xl = cx - hs; xr = cx + hs; yb = y - hs; yt = y + hs;
  cg = (.55, .55, .55);
  if(kind == 2,
    (
      fillpoly([[xl,yb],[xr,yb],[xr,yt],[xl,yt]], color->cg, alpha->.5);
      if(px >= 4, (
        draw([xl,yb],[xr,yb], color->cg, size->1);
        draw([xr,yb],[xr,yt], color->cg, size->1);
        draw([xr,yt],[xl,yt], color->cg, size->1);
        draw([xl,yt],[xl,yb], color->cg, size->1);
      ));
    ),
    if(on,
      fillpoly([[xl,yb],[xr,yb],[xr,yt],[xl,yt]], color->colMs, alpha->1),
      if(px < 4,
        fillpoly([[xl,yb],[xr,yb],[xr,yt],[xl,yt]], color->colMs, alpha->.25),
        (
          fillpoly([[xl,yb],[xr,yb],[xr,yt],[xl,yt]], color->thPaper, alpha->1);
          draw([xl,yb],[xr,yb], color->colMs, size->1);
          draw([xr,yb],[xr,yt], color->colMs, size->1);
          draw([xr,yt],[xl,yt], color->colMs, size->1);
          draw([xl,yt],[xl,yb], color->colMs, size->1);
        )
      )
    )
  );
);

// ---- board: one row of circles per step; rows with measurement boxes; registers click targets in uiHits ----
// walk = list of states (row 0 .. N), origin = centre of the top row, dx/dy = column/row pitch, r = circle radius
drawWalkBoard(walk, origin, dx, dy, r) := (
  regional(upperCenterX, upperCenterY, numRows, rno, state, numSites, stepCount, y, rowMeasured, xl, xr, xP, xQ,
           j, x, hx, hy, hint, hsz);
  upperCenterX = origin_1;
  upperCenterY = origin_2;
  numRows  = length(walk);
  xl = upperCenterX - (numRows - 0.5)*dx;        // left / right edge of the board
  xr = upperCenterX + (numRows - 0.5)*dx;

  forall(1..numRows, rno, (
    state = walk_rno;
    numSites = length(state);
    stepCount = rno - 1;
    y = upperCenterY - (numRows-rno) * dy;

    rowMeasured = false;
    if(msOn,
      (
        // box columns: both kinds on -> "Ort" | "Qubit" side by side, otherwise the single kind next to the board
        xP = if(msBothOn(), xl - 0.75*msBoxW(), xl - 0.5*msBoxW());   // centre of the position box column
        xQ = if(msBothOn(), xl - 0.25*msBoxW(), xl - 0.5*msBoxW());   // centre of the coin box column
        if(msPosOn & stepCount >= 1,
          (
            // position box + band; both toggle the position measurement
            uiHits = uiHits ++ [[xl, y - dy/2, xr, y + dy/2, "r" + stepCount]];
            uiHits = uiHits ++ [[xl - msBoxW(), y - dy/2, if(msBothOn(), xl - 0.5*msBoxW(), xl), y + dy/2, "r" + stepCount]];
            rowMeasured = (msRows_stepCount == 1);
            if(rowMeasured, msRowDecor(xl, xr, y, dy));
            msChkDraw(xP, y, dy, rowMeasured, 0);
          )
        );
        // qubit box in every row 0..N
        if(msCoinOn,
          (
            uiHits = uiHits ++ [[if(msBothOn(), xl - 0.5*msBoxW(), xl - msBoxW()), y - dy/2, xl, y + dy/2, "q" + stepCount]];
            msChkDraw(xQ, y, dy, msCoinFlag(stepCount), if(msGreyed(stepCount), 2, 1));
            if((msCoinFlag(stepCount) % msGreyed(stepCount)) & stepCount < length(msCoinOut), if(msCoinOut_(stepCount + 1) > 0, msRowFrame(xl, xr, y, dy, msCoinOut_(stepCount + 1))));
          )
        );
      )
    );

    // animation mode: while a cycle runs (animT < 1) the last row (N) is shown only through the transitions of row N-1;
    // at the end of the cycle (animT = 1) everything is drawn statically
    forall(1..numSites, j, (
      if(isReachable(j, stepCount) & !(animOn & animT < 1 & rno == numRows & numRows > 1),
        (
          x = upperCenterX + (j - mid) * dx;
          if(rowMeasured,
            if(j == msOut_stepCount,
              (drawSite([x,y], r, state_j); drawcircle([x,y], r, color->colMs, size->3);),
              (fillcircle([x,y], r, color->cLightGray, alpha->.03);
               drawcircle([x,y], r, color->cLightGray, alpha->.45, size->1);)
            ),
            drawSite([x,y], r, state_j)
          );
          // the step from this site to the next row (not from sites without amplitude)
          if(animOn & animT < 1 & rno < numRows & abs(state_j_1)^2 + abs(state_j_2)^2 > 1e-12,
            (
              stateTransitionUp([x,y], [x - dx, y + dy], r, coinP, coinRot, state_j, animT);
              stateTransitionDown([x,y], [x + dx, y + dy], r, coinP, coinRot, state_j, animT);
            )
          );
        )
      );
    ));
  ));
  // column headers above the box columns
  if(msOn,
    (
      hx = xl;
      hy = upperCenterY + r + 0.12;      // inside the gap reserved between board and histogram
      drawtext([hx - 0.5*msBoxW(), hy + 0.3], tr("msCol"),
               align->"mid", size->fs(fsTick), bold->true, color->colMs);
      // short hint right of the column headers (scaled to fit half the board width)
      if(msPosOn,
        (
          hint = tr("msHint");
          hsz = min(fs(fsTick), 0.5*(numRows - 0.5)*2*dx*screenresolution()/(0.55*length(hint)));
          drawtext([hx + 0.12, hy + 0.04], hint, align->"left", size->hsz, color->thMuted);
        )
      );
      if(msPosOn, drawtext([hx - if(msBothOn(), 0.75, 0.5)*msBoxW(), hy], tr("msColPos"), align->"mid", size->fs(fsTick), color->colMs));
      if(msCoinOn, drawtext([hx - if(msBothOn(), 0.25, 0.5)*msBoxW(), hy], tr("msColCoin"), align->"mid", size->fs(fsTick), color->colMs));
    )
  );
);

// ---- per-row mini histograms ----
// x0..x1 = column, topY = centre of the top row, dy = row pitch, r = circle radius,
// T = number of rows, s = N, mLoc = index of site 0. Row k shows msPre_(k+1) (before the row's measurements),
// same x axis in every row (sites -s..s), each row scaled to its own maximum. Thin rows: heat strip.
// The sampled site of a position-measured row is violet.
drawMiniRows(x0, x1, topY, dy, r, T, s, mLoc) := (
  regional(kp, hh, hb, strip, sw, qk, y, P, pm, qi, qx, jj, v, xa, xb, yb, bh, hit, yTop, ybot, hsz, tl);
  kp = screenresolution();
  sw = (x1 - x0)/(2*s + 1);
  hh = 0.86*if(dy > 0, dy, 2*r);       // row band (background, heat strips)
  strip = hh*kp < 10;
  hb = 0.55*if(dy > 0, dy, 2*r);       // bar height of a row's mini histogram: about half the row pitch
  ybot = topY - (T - 1)*dy - hh/2 - 0.02;  yTop = topY + hh/2 + 0.02;
  fillpoly([[x0, ybot], [x1, ybot], [x1, yTop], [x0, yTop]], color->(.5,.5,.5), alpha->.05);
  draw([x0 + (s + 0.5)*sw, ybot], [x0 + (s + 0.5)*sw, yTop], color->(.5,.5,.5), alpha->.35, size->1);   // site 0
  forall(0..(T - 1), qk, (
    y = topY - (T - 1 - qk)*dy;
    P = msPre_(qk + 1);
    pm = 0;
    forall(0..qk, qi, (v = P_(mLoc - qk + 2*qi); if(v > pm, pm = v)));
    hit = if(qk >= 1, if(msRows_qk == 1, msOut_qk, 0), 0);
    if(pm > 0,
      forall(0..qk, qi, (
        qx = -qk + 2*qi;
        jj = mLoc + qx;
        v = P_jj/pm;
        xa = x0 + (qx + s)*sw + 0.1*sw;  xb = x0 + (qx + s + 1)*sw - 0.1*sw;
        if(strip, (xa = xa - 0.1*sw; xb = xb + 0.1*sw));
        if(v > 1e-9 % jj == hit,
          if(strip,
            fillpoly([[xa, y - hh/2], [xb, y - hh/2], [xb, y + hh/2], [xa, y + hh/2]],
                     color->if(jj == hit, colMs, colDist), alpha->if(jj == hit, 1, min(1, .12 + v))),
            (
              yb = y - hb/2;  bh = hb*v;
              fillpoly([[xa, yb], [xb, yb], [xb, yb + bh], [xa, yb + bh]], color->if(jj == hit, colMs, colDist), alpha->1);
            )
          )
        );
      ))
    );
    // thin baseline of the row's mini histogram (reachable sites only)
    if(!strip, draw([x0 + (s - qk)*sw, y - hb/2], [x0 + (s + qk + 1)*sw, y - hb/2], color->(.5,.5,.5), alpha->.45, size->1));
  ));
  // header: title and axis labels (sites -N, 0, N) above the column
  hsz = min(fs(fsTick), (x1 - x0)*kp/(0.6*length(tr("msMiniChip"))));
  drawtext([(x0 + x1)/2, yTop + 0.42], tr("msMiniChip"), align->"mid", size->hsz, bold->true, color->colMs);
  tl = fs(fsTick - 1);
  drawtext([x0 + 0.5*sw, yTop + 0.12], "" + (-s), align->"left", size->tl, color->thMuted);
  drawtext([x0 + (s + 0.5)*sw, yTop + 0.12], "0", align->"mid", size->tl, color->thMuted);
  drawtext([x1 - 0.5*sw, yTop + 0.12], "" + s, align->"right", size->tl, color->thMuted);
);

// ---- probability axis at the left edge of the histogram: ticks at a "nice" spacing (1, 2, 5 x 10^n) ----
// (x0, y0) = bottom-left, h = height of the full scale, vtop = probability at full height, sc = 1/vtop
drawProbAxis(x0, y0, h, vtop, sc) := (
  regional(mg, sd, sI, kk, tv, ty);
  mg = vtop/3;
  sd = 10^floor(log(mg)/log(10));
  sI = mg/sd;
  sI = if(sI < 1.5, 1, if(sI < 3.5, 2, if(sI < 7.5, 5, 10)));
  sd = sI*sd;
  draw([x0, y0], [x0, y0 + h], color->thFg, size->1);
  forall(0..floor(vtop/sd + 1e-9), kk, (
    tv = kk*sd;  ty = y0 + tv*sc*h;
    draw([x0 - 0.07, ty], [x0, ty], color->thFg, size->1);
    if(kk > 0, drawtext([x0 - 0.1, ty - 0.05], format(tv, 3), align->"right", size->fs(fsTick), color->thFg));
  ));
);

// ---- histogram of the final distribution ----
// state = reachable slice, center = [x, y] of the baseline middle, size = [width, height].
// Series: orange = single run, violet = exact ensemble mean, green = Galton board, dots = collected frequencies.
// All series share ONE scale: the tallest value reaches the full height.
drawDist(state, center, size) := (
  regional(P, Nb, cx, w, h, x0, y0, bw, pad, pmax, ens, ensOn, emax, fmax, gmax, gs, smax, sc, vtop,
           jj, xL, xR, bh, xc, dRad, jf, lastMeas, mI, dd, kk, pg, gl, lgY, lgTx, lgW1, mHs);
  if(length(state) == 0, return());
  P = probsOf(state);
  Nb = length(P);
  cx = center_1;
  w  = size_1;   h  = size_2;
  pmax = maxOf(P);

  // violet exact mean only if switched on and available for this size
  ensOn = msOn & msExOn & msAnyMeas() & length(msEns) == Nb;
  ens = if(ensOn, msEns, []);
  emax = if(ensOn, maxOf(ens), 0);
  fmax = if(msOn & length(msFq) == Nb, maxOf(msFq), 0);
  // last row measured: the single run ends deterministically in one site -> marker instead of a bar
  lastMeas = msOn & msAnyMeas() & maxSteps > 0 & msRows_maxSteps == 1;
  jf = 0;
  if(lastMeas & length(msOut) >= maxSteps, jf = msOut_maxSteps - (mid - maxSteps) + 1);
  gmax = 0;
  gl = [];
  if(gauss,
    // Galton board: Bin(N, q) on the reachable sites x = 2k - N, k = number of steps to the right
    (
      gs = round((Nb - 1)/2);
      gl = apply(0..gs, kk, comb(gs, kk)*galtonPow(stQ, kk)*galtonPow(1 - stQ, gs - kk));
      gmax = maxOf(gl);
    )
  );

  // ONE common scale: tallest of all drawn series reaches the full height
  smax = pmax;
  if(msOn, smax = max(fmax, if(lastMeas, 0, pmax)));
  if(ensOn, smax = max(smax, emax));
  smax = max(smax, gmax);                       // the green bars always take part in the common scale
  if(smax <= 0, smax = 1);
  sc   = if(distNormalizeToMax, 1/smax, 1);
  vtop = 1/sc;                                  // probability at full height

  x0 = cx - w/2;  y0 = center_2;
  bw = w / Nb;
  pad = 0.05*bw;

  draw([x0, y0], [x0 + w, y0], color->thFg);      // baseline
  drawProbAxis(x0, y0, h, vtop, sc);

  // orange: current single run (filled; no bar if the last row is measured)
  forall(1..Nb, jj, (
    bh = P_jj*sc*h;
    if(bh > 0 & !lastMeas,
      (
        xL = x0 + (jj-1)*bw + pad;  xR = x0 + jj*bw - pad;
        fillpoly([[xL,y0],[xR,y0],[xR,y0+bh],[xL,y0+bh]], color->colDist, alpha->1);
      )
    );
  ));

  // violet: exact ensemble average (filled, narrower, in front of orange)
  if(ensOn,
    forall(1..Nb, jj, (
      bh = ens_jj*sc*h;
      if(bh > 0,
        (
          xL = x0 + (jj-1)*bw + pad + .18*bw;  xR = x0 + jj*bw - pad - .18*bw;
          fillpoly([[xL,y0],[xR,y0],[xR,y0+bh],[xL,y0+bh]], color->colMs, alpha->.85);
        )
      );
    ))
  );

  // optional: classical Galton board Bin(N, q); only sites of the right parity carry a bar
  if(gauss,
    (
      mI = 1 + floor((Nb - 1)/2);
      forall(1..Nb, jj, (
        dd = jj - mI;
        if(abs(dd) <= gs & (mod(abs(dd),2) == mod(gs,2)),
          (
            kk = (gs + dd)/2;
            pg = gl_(kk + 1);
            bh = (pg * sc) * h;
            if(bh > 0,
              (
                xL = x0 + (jj-1)*bw + pad+.3*bw;
                xR = x0 + jj*bw - pad-.3*bw;
                fillpoly([[xL,y0],[xR,y0],[xR,y0+bh],[xL,y0+bh]], color->colGauss, alpha->1);
              )
            );
          )
        );
      ));
    )
  );

  // collected relative frequencies: dots
  if(msOn & length(msFq) == Nb,
    (
      dRad = max(2, min(3.5, 0.3*bw*screenresolution()))/screenresolution();
      forall(1..Nb, jj, (
        if(msFq_jj > 0,
          (
            xc = x0 + (jj - 0.5)*bw;
            fillcircle([xc, y0 + min(msFq_jj*sc, 1)*h], dRad + 0.6/screenresolution(), color->thPaper, alpha->1);
            fillcircle([xc, y0 + min(msFq_jj*sc, 1)*h], dRad, color->colMsDark, alpha->1);
          )
        );
      ));
    )
  );

  // deterministic outcome: orange triangle marker on the baseline, drawn last (on top of everything):
  // opaque strong orange with a white halo and a thin dark outline so it separates from the violet bars
  if(jf >= 1 & jf <= Nb,
    (
      xc = x0 + (jf - 0.5)*bw;
      mHs = max(0.7*bw, 7/screenresolution());
      mHs = min(mHs, 0.17);
      fillpoly([[xc - mHs - 0.025, y0 - 0.045], [xc + mHs + 0.025, y0 - 0.045], [xc, y0 + 1.75*mHs + 0.04]], color->thPaper, alpha->1);
      fillpoly([[xc - mHs, y0 - 0.02], [xc + mHs, y0 - 0.02], [xc, y0 + 1.75*mHs]], color->thOrange, alpha->1);
      drawpoly([[xc - mHs, y0 - 0.02], [xc + mHs, y0 - 0.02], [xc, y0 + 1.75*mHs]], color->thFg, size->1);
    )
  );

  // small legend above the histogram (not in measurement mode: it is in the panel)
  if(!msOn,
    (
      lgY  = y0 + h + 0.2;
      lgTx = "■ " + tr("legQW");
      lgW1 = 0.6*fs(12)*length(lgTx)/screenresolution() + 0.3;
      drawtext([x0, lgY], lgTx, align->"left", size->fs(12), color->thOrange);
      if(gauss,
        drawtext([x0 + lgW1, lgY], "■ " + tr("legGalton") + ", q = " + uiFmt2(stQ) + ")", align->"left", size->fs(12), color->colGauss)
      );
    )
  );
);

// ---- board + histogram packed into the rectangle [BL, TR] ----
// histFrac = share of the height for the histogram, gap = space between board and histogram
drawWalkInRectWithFrac(walk, BL, TR, histFrac, gap) := (
  regional(xL, yB, xR, yT, W, H, qmOn, qmW, qmX0, qmX1, T, S, Np, s, mLoc, f, Hhist, Hboard, Nused, dx, rH, rV, r, dy,
           xC, topX, topY, jL, jR, subS, yAxis, hUsed, j);
  xL = BL_1; yB = BL_2; xR = TR_1; yT = TR_2;
  W  = xR - xL;         H  = yT - yB;
  if(W <= 0 % H <= 0, return());

  // optional column of per-row mini histograms at the right edge: board and histogram get narrower
  qmOn = msOn & msMiniOn & length(msPre) == length(walk);
  qmW = 0;
  qmX0 = xR; qmX1 = xR;
  if(qmOn, (
    qmW = max(1.4, min(3.2, 0.2*W));
    qmX1 = xR;
    W = W - qmW - 0.3;
    qmX0 = xL + W + 0.3;
  ));

  // time/space
  T = length(walk);                 if(T == 0, return());
  S = walk_(-1);                    // last state
  Np = length(S);                   if(Np == 0, return());
  s = T - 1;                        // last step count (>=0)
  mLoc = 1 + floor((Np - 1)/2);     // local middle index of S

  // split height
  f = max(0, min(1, histFrac));
  Hhist  = f * H;
  Hboard = H - Hhist;

  // column spacing fitted to the reachable width (2s+1 columns)
  Nused = 2*s + 1;
  dx    = W / Nused;

  // circle radius + row spacing
  rH = 0.5 * dx;
  rV = if(T > 0, Hboard / (2*T), Hboard/2);
  r  = 0.98 * min(rH, rV);
  dy = if(T > 1, (Hboard - 2*r) / (T - 1), 0);

  // top-centre of the board
  xC   = xL + W/2;
  topX = xC + (mid - mLoc) * dx;    // compensate if global 'mid' differs from the local middle
  topY = yB + Hboard - r;

  drawWalkBoard(walk, [topX, topY], dx, dy, r);
  if(qmOn, drawMiniRows(qmX0, qmX1, topY, dy, r, T, s, mLoc));

  // histogram over the reachable slice only, spanning the full width W
  jL   = max(1, mLoc - s);
  jR   = min(Np, mLoc + s);
  subS = apply(jL..jR, j, S_j);
  msFq = [];                        // global: also read by drawDist
  if(msOn & msN > 0, msFq = apply(jL..jR, j, msCnt_j/msN));

  // baseline just above the top row
  yAxis  = topY + r + gap;
  hUsed  = max(0.000001, Hhist - gap);  // tiny clamp so the height is never 0
  drawDist(subS, [xC, yAxis], [W, hUsed]);
);


// =====================================================================
// 7  UI: clickable chips, cards, sliders, start-state circle, measurement panel
// =====================================================================

// state that must survive layout changes (handles are re-placed from it by layRemap)
stP   = 0.5;                          // slider fraction of bias p
stPhi = 0;                            // slider fraction of phase phi (as a fraction of 2 pi)
stN   = 5;                            // number of steps
stSp  = 0.5;                          // slider fraction of the animation speed (0.5 ~ 3 seconds per step)
stQ   = 0.5;                          // Galton board: probability q of going right
zUpS   = [sqrt(.5), 0];               // up knob relative to circle centre / r
zDownS = [0, sqrt(.5)];               // down knob relative to circle centre / r
gauss = false;                        // Galton board on/off
initphaseR = 1;                       // radius of the start-state circle

// ---- generic formatting helpers ----
// number with exactly 2 decimals
uiFmt2(x) := (
  regional(k);
  k = round(x*100);
  "" + floor(k/100) + "." + floor(mod(k,100)/10) + mod(k,10)
);

// wrap angle to (-pi, pi]
wrapPi(a) := (
  regional(b);
  b = a - 2*pi*floor((a + pi)/(2*pi));
  if(b <= -pi, b + 2*pi, b)
);

// pretty-print as multiple of π (e.g. -0.5π, 1.25π)
formatPi(phi) := (
  regional(k);
  k = round((phi/pi)*100)/100;           // 2 decimal multiples of π
  if(abs(k) < 1e-9, "0",
    if(abs(k-1) < 1e-9, "π",
      if(abs(k+1) < 1e-9, "-π",
        format(k,2) + "π"
      )
    )
  )
);

// ---------------------------------------------------------------------
// CLICKABLE TEXT CHIPS (no JS buttons): every chip is drawn each frame and
// registers its screen rectangle in uiHits; csmouseup picks the hit whose
// centre is nearest to the mouse and dispatches on the action string via uiAct().
// Active chip: solid colour + bold white text. Inactive: white, coloured outline + text.
// ---------------------------------------------------------------------
uiHits = [];       // click targets [xl, yb, xr, yt, action] of the current frame
uiForceW = 0;      // > 0: next chip gets exactly this width (equal-width grids)
uiOff = false;     // true: chips drawn greyed out and without click target
uiNoGrow = false;  // true: chips keep their height on touch (tab bar sizes its own chips)
uiMinW = 0;        // minimal chip width (keeps very short labels easy to hit)
uiPressA = "";    // action of the last clicked chip (pressed feedback)
uiPressT = -10;    // seconds() of that click

// outline of a rounded rectangle (top-left x0, yt; width w; height h; corner radius r)
cdRPts(x0, yt, w, h, r, nn) := (
  regional(ctr, pts, cc, kk, a);
  ctr = [[x0 + w - r, yt - r], [x0 + r, yt - r], [x0 + r, yt - h + r], [x0 + w - r, yt - h + r]];
  pts = [];
  forall(0..3, cc, forall(0..nn, kk, (
    a = (cc + kk/nn)*pi/2;
    pts = pts ++ [ctr_(cc + 1) + r*[cos(a), sin(a)]];
  )));
  pts
);

// natural width of a chip (world units)
uiChipW(txt, fsz) := (
  regional(szw);
  szw = fs(fsz)/screenresolution();
  max(uiMinW, 0.6*fs(fsz)*length(txt)/screenresolution() + 1.2*szw)
);

// pos = anchor (text baseline), align "left"|"mid"|"right"; returns chip width (world units)
uiChipC(pos, txt, active, action, align, col, fsz) := (
  regional(szw, wd, xl, yb, yt, pts, hp, wp, pr, hc);
  szw = fs(fsz)/screenresolution();
  hc = cdChipH;
  if(touchOn & layTabs & !uiNoGrow, hc = max(hc, min(cdTouchChipPx/screenresolution(), cdChipH + 0.1)));   // touch: slightly taller chips (chip rows keep a gap)
  wd  = uiChipW(txt, fsz);
  if(uiForceW > 0, wd = uiForceW);
  xl  = if(align == "right", pos_1 - wd, if(align == "mid", pos_1 - wd/2, pos_1));
  yb  = pos_2 - (hc - 0.7*szw)/2;
  yt  = yb + hc;
  pts = cdRPts(xl, yt, wd, hc, 0.1, 3);
  if(uiOff, (col = (.55,.55,.55); active = false));             // disabled: grey, not clickable
  pr = !uiOff & (action == uiPressA) & (seconds() - uiPressT < 0.2);     // pressed feedback for 0.2 s after a click
  fillpoly(pts, color->if(pr, 0.55*col, if(active, col, thPaper)), alpha->1);
  drawpoly(pts, color->col, size->if(active, 1, 1.4));
  drawtext([xl + wd/2, pos_2], txt, align->"mid", size->fs(fsz), bold->active % pr,
           color->if(pr, (1,1,1), if(active, thOnCol, col)));
  // click target at least cdTouchPx high (touch: cdTouchMin high and wide), padded invisibly
  hp = max(0, (max(cdTouchPx, if(touchOn, cdTouchMin, 0))/screenresolution() - hc)/2);
  wp = if(touchOn, max(0.03, (cdTouchMin/screenresolution() - wd)/2), 0.03);
  if(!uiOff, uiHits = uiHits ++ [[xl - wp, yb - hp, xl + wd + wp, yt + hp, action]]);
  wd
);
uiChip(pos, txt, active, action, align) := uiChipC(pos, txt, active, action, align, thBlue, fsTxt);

// row of chips centered at cx; items = [[txt, active, action], ...]; baseline y
uiRow(cx, y, items, col, fsz) := (
  regional(tot, x0, it, wd, gp);
  gp = 0.12;
  tot = sum(apply(items, it, uiChipW(it_1, fsz))) + gp*(length(items) - 1);
  x0 = cx - tot/2;
  forall(items, it, (
    wd = uiChipC([x0, y], it_1, it_2, it_3, "left", col, fsz);
    x0 = x0 + wd + gp;
  ));
);

// centered 2x2 grid; items = [[txt, active, action], ...] (4 entries, row-major);
// columns get equal widths (max chip width of the column), whole grid centered at cx.
uiGrid(cx, y, dyRow, items, col, fsz) := (
  regional(w1, w2, gp, x0, k, it, rowY, colX, colW);
  gp = 0.12;
  if(touchOn & layTabs, dyRow = dyRow + 0.12);                  // touch + tabs: taller chips need more row distance
  w1 = max(uiChipW(items_1_1, fsz), uiChipW(items_3_1, fsz));
  w2 = max(uiChipW(items_2_1, fsz), uiChipW(items_4_1, fsz));
  x0 = cx - (w1 + gp + w2)/2;
  forall(1..4, k, (
    it = items_k;
    colX = if(mod(k,2) == 1, x0, x0 + w1 + gp);
    colW = if(mod(k,2) == 1, w1, w2);
    rowY = if(k <= 2, y, y - dyRow);
    uiForceW = colW;
    uiChipC([colX, rowY], it_1, it_2, it_3, "left", col, fsz);
    uiForceW = 0;
  ));
);

// card geometry accessors: x centre and top edge of card i
cdCx(i) := layCard_i_1 + layCard_i_3/2;
cdTop(i) := layCard_i_2 - if(layTabs & i < 5, (layCard_i_4 - layNat_i)/2, 0);   // tabs: content centred vertically in the shared slot
layNat = [4.7, 4.8, 4.8, 4.8];      // natural content height (from the card top) of cards 1..4
cdInW() := if(layTabs, layCard_1_3, cdCW);                              // inner card width reference (tabs: the full-width card)
layRail() := if(layTabs, min(7, layCard_1_3 - 2*cdPad - 0.4), layL);   // slider rail length (tabs: the card's inner width)

// card frame: rounded outline, faint tint, title with separator
cdFrame(i, ttl, col) := (
  regional(x0, yt, w, pts);
  x0 = layCard_i_1;  yt = layCard_i_2;  w = layCard_i_3;
  pts = cdRPts(x0, yt, w, layCard_i_4, 0.16, 5);
  fillpoly(pts, color->col, alpha->thCardA);
  drawpoly(pts, color->col, size->1.6);
  drawtext([x0 + cdPad, yt - 0.47], ttl, align->"left", size->fs(fsCard), bold->true, color->col);
  draw([x0 + cdPad, yt - 0.66], [x0 + w - cdPad, yt - 0.66], color->col, alpha->.35, size->1);
);

// tick with label under a rail
cdTick(xt, y, txt, col) := (
  draw((xt, y + 0.1), (xt, y - 0.1), color->col);
  drawtext((xt, y - 0.4), txt, align->"mid", size->fs(fsTick), color->col);
);

// ---- presets ----
uiSq = sqrt(.5);
coinPre  = [[.5, 0], [1, 0], [0, 0], [.5, .25]];          // [p, phi/(2 pi)]
startPre = [[[1,0],[0,0]], [[0,0],[1,0]], [[uiSq,0],[uiSq,0]], [[uiSq,0],[0,uiSq]]];   // [[re,im] of up, [re,im] of down]

applyCoin(k) := (
  stP = coinPre_k_1;  stPhi = coinPre_k_2;
  layRemap();                                  // slider handles jump
);
applyStart(k) := (
  zUpS = startPre_k_1;  zDownS = startPre_k_2;
  layRemap();                                  // knobs jump
);
coinActive(k) := abs(stP - coinPre_k_1) < 1e-3 &
                 (abs(stPhi - coinPre_k_2) < 1e-3 % coinPre_k_1 == 0 % coinPre_k_1 == 1);
startActive(k) := abs(zUpS_1 - startPre_k_1_1) + abs(zUpS_2 - startPre_k_1_2)
                + abs(zDownS_1 - startPre_k_2_1) + abs(zDownS_2 - startPre_k_2_2) < 2e-3;

// preset chips (card 2: 2x2 grid; card 3: one row)
drawCoinChips(cx, y) := (
  uiGrid(cx, y, 0.62, [[tr("coinHad"), coinActive(1), "c1"], [tr("coinStay"), coinActive(2), "c2"],
                       [tr("coinSwap"), coinActive(3), "c3"], [tr("coinCmplx"), coinActive(4), "c4"]],
         thBlue, fsTxt);
);
drawStartChips(cx, y) := (
  drawtext((cx, y + 0.55), tr("startCap"), align->"mid", size->fs(fsTxt), color->thMuted);
  uiMinW = 0.85;
  uiRow(cx, y, [["|←⟩", startActive(1), "s1"], ["|→⟩", startActive(2), "s2"],
                ["|←⟩+|→⟩", startActive(3), "s3"], ["|←⟩+i|→⟩", startActive(4), "s4"]],
         thBlue, fsTxt);
  uiMinW = 0;
);

// place the Galton q handle: on its rail while the board is on, parked outside the window otherwise
placeQHandle() := (
  slQP.xy = if(gauss & cardShown(4), (cdCx(4) - 0.5*layRail() + stQ*layRail(), layQy), (layXl - 20, layYt + 20));
);

// speed handle: parked outside the window unless in animation mode; makeSpeedslider re-places it on its rail
// whenever the rail has moved (spX0 / spL remember the rail of the last frame)
spX0 = -1e9;  spL = 0;
placeSpHandle() := (
  spX0 = -1e9;
  if(!animOn % !cardShown(5), slSpP.xy = (layXl - 20, layYt + 20));

// all chip actions (action strings are set where the chips are drawn)
uiAct(a) := (
  uiPressA = a;  uiPressT = seconds();
  if(a == "de", lang = "de");
  if(a == "en", lang = "en");
  if(a == "link", linkOpen());
  if(length(a) == 4 & substring(a, 0, 3) == "tab", (layTab = parse(substring(a, 3, 4)); layRemap()));
  if(a == "theme", (themeUser = 1 - themeCur; themeApply()));    // explicit choice overrides the system preference
  if(a == "binom", (gauss = !gauss; placeQHandle()));
  if(a == "animmode" & !msOn, animSetMode(!animOn));
  if(a == "anim", animrun = !animrun);            // pause / resume (the loop is started / stopped by loopSync)
  // the two measurement kinds are independent toggles (position / coin)
  if(a == "mp" & !animOn, (msPosOn = !msPosOn; msSync()));
  if(a == "mk" & !animOn, (msCoinOn = !msCoinOn; msSync()));
  if(a == "mx", msExOn = !msExOn);       // exact ensemble mean on/off (computed only while on, cache kept)
  if(a == "mm", msMiniOn = !msMiniOn);   // per-row mini histograms on/off
  // fill helpers, separate for the position column (rows 1..N) and the coin column (rows 0..N);
  // they edit the stored user flags (msRowsU / msCoinU); only rows <= N are set. The effective flags
  // (msRows / msCoin, see msEffective) change, so msUpdate() resets caches (ensemble, counts).
  if(a == "msAll",  msRowsU = apply(1..maxmaxSteps, k, if(k <= maxSteps, 1, 0)));
  if(a == "msNone", msRowsU = apply(1..maxmaxSteps, k, 0));
  if(a == "mcAll",  msCoinU = apply(1..(maxmaxSteps + 1), k, if(k <= maxSteps + 1, 1, 0)));
  if(a == "mcNone", msCoinU = apply(1..(maxmaxSteps + 1), k, 0));
  if(a == "msRoll", (msU = apply(1..maxmaxSteps, k, random()); msU2 = apply(1..(maxmaxSteps + 1), k, random())));
  if(a == "ms1", msQueue(1));
  if(a == "ms100", msQueue(100));
  if(a == "msReset", (
    msCnt = apply(1..(2*maxmaxSteps + 1), k, 0);
    msN = 0; msPending = 0;
  ));
  // "r<k>": toggle position measurement of row k; "q<k>": toggle coin measurement of row k
  if(length(a) > 1 & substring(a, 0, 1) == "r" & msPosOn, (
    msRowK = parse(substring(a, 1, length(a)));
    msRowsU_msRowK = 1 - msRowsU_msRowK;
  ));
  if(length(a) > 1 & substring(a, 0, 1) == "q" & msCoinOn, (
    msRowK = parse(substring(a, 1, length(a)));
    // greyed boxes (coin already fixed by the position measurement) are not clickable
    if(!msGreyed(msRowK), msCoinU_(msRowK + 1) = 1 - msCoinU_(msRowK + 1));
  ));
  forall(1..4, k, (
    if(a == "c" + k, applyCoin(k));
    if(a == "s" + k, applyStart(k));
  ));
);
